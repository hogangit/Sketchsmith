/**
 * src/core/bus.js —— 事件总线
 *
 * 能力钩子、音频、HUD 都挂在总线上。**handler 真被调用的次数要能读出来**：
 * 只 connect 不计数等于没验证过（见 tests 目录里的计数断言用例）。

const PERF_DOWNGRADE_FRAMES = 30;
const PERF_P90_BUDGET_MS = 16.7;
const PERF_P90_FRAMES = 120;
const RENDER_DPR_CAP = 2;

const PERF_TIERS = ['low', 'mid', 'high'];

  const i = PERF_TIERS.indexOf(t);
  return i < 0 ? 1 : i;

  try {
    const ua = navigator.userAgent || '';

 *
 * 三条硬约束（spec 红线）：
 *   · 不改任何关卡几何/物理/判定——本文件只画，不产生刚体；
 *   · 色值只从 art-polish-spec 第二节色板取（E1/E2/E4/I2/I3/E5），不出现表外 hex；
 *   · 确定性：用固定 seed 的局部 PRNG（mulberry32），同一关每次进入布局完全一致
 *     （注意：不用全局 nextInkSeed——它跨关卡递增、重进关卡布局会变）。
 *
 * 调用约定：drawSoilTexture 在「已 translate+rotate+clip 到土体矩形」的上下文里调用，
 * 坐标为刚体局部坐标 x∈[-w/2,w/2], y∈[-h/2,h/2]，顶面 y=-h/2；
 * drawSoilTufts 在 clip 之外调用（草要越过顶边长到地面上方）。
 */

/** mulberry32：确定性 PRNG，同 seed 同序列 */
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** FNV-1a 字符串哈希 → 稳定 seed */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/**
 * 土体剖面纹理（在 clip 内绘制，只画土面以下）。
 * @param {CanvasRenderingContext2D} ctx 已 translate+rotate+clip 的上下文
 * @param {number} w 土体宽
 * @param {number} h 土体高
 * @param {string} tier 'low' | 'mid' | 'high'
 * @param {string} seedKey 关卡稳定键（建议 levelId + 土体坐标）
 */
function drawSoilTexture(ctx, w, h, tier, seedKey) {
  const rng = makeRng(hashStr(seedKey + ':tex'));
  const top = -h / 2;
  const mid = tier !== 'low';
  const high = tier === 'high';

  // ① 表土暗带 12px（E1）+ 3px 过渡
  ctx.fillStyle = 'rgba(120,104,74,0.30)';   // E1
  ctx.fillRect(-w / 2, top, w, 12);
  ctx.fillStyle = 'rgba(90,80,64,0.14)';
  ctx.fillRect(-w / 2, top + 12, w, 3);

  // ② 水平层理（mid/high）：每 16px 一条细横线，带 ±1px 抖动，避免机械重复
  if (mid) {
    ctx.strokeStyle = 'rgba(110,96,70,0.12)';
    ctx.lineWidth = 1;
    for (let y = top + 18; y < h / 2 - 2; y += 16) {
      const j = (rng() - 0.5) * 2;
      ctx.beginPath();
      ctx.moveTo(-w / 2, y + j);
      ctx.lineTo(w / 2, y + j);
      ctx.stroke();
    }
  }

  // ③ 斜向土纹 hachure（mid/high）：保留原思路，间距 13
  if (mid) {
    ctx.strokeStyle = 'rgba(110,96,70,0.20)';  // E2 加强一点
    ctx.lineWidth = 1;
    for (let hx = -w / 2 - h; hx < w / 2; hx += 13) {
      ctx.beginPath();
      ctx.moveTo(hx, h / 2);
      ctx.lineTo(hx + h, top);
      ctx.stroke();
    }
  }

  // ④ 碎石（mid/high）：8–12 块椭圆，E4 填充 + I2 描边
  if (mid) {
    const n = 8 + Math.floor(rng() * 5);
    for (let i = 0; i < n; i++) {
      const x = -w / 2 + 6 + rng() * Math.max(1, w - 12);
      const y = top + 16 + rng() * Math.max(1, h - 24);
      const r = 3 + rng() * 2;
      ctx.fillStyle = 'rgba(120,110,96,0.55)';   // E4
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 0.7, rng() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(91,83,68,0.60)';    // I2 淡
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // ⑤ 根须（mid/high）：2–3 条折线，从表土往下钻
  if (mid) {
    const roots = 2 + Math.floor(rng() * 2);
    for (let i = 0; i < roots; i++) {
      let x = -w / 2 + 10 + rng() * Math.max(1, w - 20);
      let y = top + 2;
      ctx.strokeStyle = 'rgba(96,86,62,0.50)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, y);
      const segs = 2 + Math.floor(rng() * 2);
      for (let s = 0; s < segs; s++) {
        x += (rng() - 0.5) * 10;
        y += 6 + rng() * 8;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }

  // ⑥ 潮斑（mid/high）：2–3 团大椭圆，极淡
  if (mid) {
    const spots = 2 + Math.floor(rng() * 2);
    for (let i = 0; i < spots; i++) {
      const x = -w / 2 + 12 + rng() * Math.max(1, w - 24);
      const y = top + 20 + rng() * Math.max(1, h - 30);
      ctx.fillStyle = 'rgba(110,96,70,0.10)';
      ctx.beginPath();
      ctx.ellipse(x, y, 10 + rng() * 14, 6 + rng() * 8, rng() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  // high 档追加一层极淡竖向压暗（增强"土体有厚度"）：非必需，仅锦上添花
  if (high) {
    const g = ctx.createLinearGradient(0, top, 0, h / 2);
    g.addColorStop(0, 'rgba(70,58,44,0.00)');
    g.addColorStop(1, 'rgba(70,58,44,0.10)');   // E5 方向
    ctx.fillStyle = g;
    ctx.fillRect(-w / 2, top, w, h);
  }
}

/**
 * 地表草簇（在 clip 之外绘制，可越过土体顶边长到地面上方）。
 * 全档保留；low 档稍矮。
 * @param {CanvasRenderingContext2D} ctx 仍处于土体 translate+rotate 的上下文（未 clip）
 * @param {number} w 土体宽
 * @param {number} h 土体高
 * @param {string} tier
 * @param {string} seedKey
 */
function drawSoilTufts(ctx, w, h, tier, seedKey) {
  const rng = makeRng(hashStr(seedKey + ':tuft'));
  const top = -h / 2;
  const scale = tier === 'low' ? 0.8 : 1;
  const step = 34 + rng() * 12;
  ctx.strokeStyle = 'rgba(70,62,50,0.72)';   // I3
  ctx.lineWidth = 1;
  for (let x = -w / 2 + 6; x < w / 2 - 4; x += step) {
    const gx = x + (rng() - 0.5) * 6;
    const gh = (3 + rng() * 4) * scale;
    ctx.beginPath();
    ctx.moveTo(gx, top + 1); ctx.lineTo(gx - 2.2, top - gh);
    ctx.moveTo(gx, top + 1); ctx.lineTo(gx, top - gh - 1.5);
    ctx.moveTo(gx, top + 1); ctx.lineTo(gx + 2.2, top - gh);
    ctx.stroke();
  }
}

/**
 * 纸面颗粒（art-polish 3.6）：确定性撒 ~160 个 1px 点，给「纸的牙口」。
 * 只在场景带内调用（正文/造物簿区不撒点，保证文字可读）。low 档由调用方决定是否跳过。
 */
function drawPaperGrain(ctx, w, h, seedKey) {
  const rng = makeRng(hashStr((seedKey || 'scene') + ':grain'));
  ctx.fillStyle = 'rgba(60,52,40,0.05)';
  const n = Math.round((w * h) / 1400);     // 面积自适应，约 160 个 @430×513
  for (let i = 0; i < n; i++) {
    const x = Math.floor(rng() * w);
    const y = Math.floor(rng() * h);
    ctx.fillRect(x, y, 1, 1);
  }
}

/**
 * 场景暗角（art-polish 3.6）：径向渐变，中心透明 → 四角极淡压暗，增强聚焦。
 */
function drawSceneVignette(ctx, w, h) {
  const g = ctx.createRadialGradient(w / 2, h * 0.42, h * 0.18, w / 2, h * 0.42, h * 0.82);
  g.addColorStop(0, 'rgba(60,50,36,0)');
  g.addColorStop(1, 'rgba(60,50,36,0.06)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}

/* ══════════════════════════════════════════════════════════════════════════
 * 第四章：逐关场景元素（art-polish-spec 四章 · 每关 5 个 · 全部纯装饰无物理）
 *
 * 命名遵循规格第九章：静态 drawSc_[元素] / 动态 drawAm_[元素]。
 * 全部确定性（同关重进布局一致），全部只用色板令牌。
 * ══════════════════════════════════════════════════════════════════════════ */

/** 一块小碎石：椭圆 E4 填 + I2 描边（L1-5 / L3-5 共用） */
function SC_stone(ctx, x, y, rx, ry) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(120,110,96,0.55)';   // E4
  ctx.fill();
  ctx.strokeStyle = '#5B5344';               // I2
  ctx.lineWidth = 1;
  ctx.stroke();
}

/**
 * L1-5 洞口边缘石 + 内壁深度（本关重点）。
 * 现在的洞读起来是「贴了块黑胶布」；加上沿高光 + 内壁竖纹 + 边缘石后读成「地表的一个坑」。
 * 参数沿用 chasm 的 { x1, x2, y, depth }，不改关卡数值。
 */
function drawSc_PitDepth(ctx, s, seedKey, tier) {
  const rng = makeRng(hashStr((seedKey || 'pit') + ':pit'));
  const d = s.depth || 80;
  const top = s.y;
  ctx.save();
  // ① 上沿内投影：贴洞口一圈 2px 暗边，读成"口沿的厚度"
  const eg = ctx.createLinearGradient(0, top, 0, top + 10);
  eg.addColorStop(0, 'rgba(0,0,0,0.18)');
  eg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = eg;
  ctx.fillRect(s.x1, top, s.x2 - s.x1, 10);
  // ② 上沿高光：两侧口沿各一条亮线（纸感，不是塑料高光）
  ctx.strokeStyle = 'rgba(240,236,220,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(s.x1 + 1.5, top + 1.5); ctx.lineTo(s.x2 - 1.5, top + 1.5); ctx.stroke();
  // ③ 内壁竖纹：3 条，只在 mid/high（low 档内壁保持干净，省笔数）
  if (tier !== 'low') {
    ctx.strokeStyle = 'rgba(90,84,70,0.5)';   // I3 系
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) {
      const x = s.x1 + (s.x2 - s.x1) * (0.18 + 0.32 * i) + (rng() - 0.5) * 8;
      const len = d * (0.34 + rng() * 0.26);
      ctx.beginPath();
      ctx.moveTo(x, top + 6);
      ctx.lineTo(x + (rng() - 0.5) * 5, top + 6 + len);
      ctx.stroke();
    }
  }
  // ④ 口沿边缘石：左右各 2 块，压在地平线上（不是悬空）
  SC_stone(ctx, s.x1 - 1, top - 2, 4.6, 2.8);
  SC_stone(ctx, s.x1 + 7, top - 1.6, 3.2, 2.1);
  SC_stone(ctx, s.x2 + 1, top - 2, 4.2, 2.6);
  SC_stone(ctx, s.x2 - 7, top - 1.6, 3.0, 2.0);
  ctx.restore();
}

/**
 * L1-4 / L2-2 草垛：半圆弧 + 放射 5 线（E1 填 + I3 描），与草簇同一语言。
 */
function drawSc_Haystack(ctx, s, seedKey) {
  const rng = makeRng(hashStr((seedKey || 'hay') + ':hay'));
  const w = s.w || 26;
  const h = s.h || 15;
  const x = s.x;
  const y = s.y;
  ctx.save();
  // 垛体：下半矩形 + 上半弧（干草堆的剪影）
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y);
  ctx.lineTo(x - w / 2, y - h * 0.45);
  ctx.quadraticCurveTo(x, y - h * 1.22, x + w / 2, y - h * 0.45);
  ctx.lineTo(x + w / 2, y);
  ctx.closePath();
  ctx.fillStyle = 'rgba(120,104,74,0.30)';   // E1
  ctx.fill();
  ctx.strokeStyle = 'rgba(70,62,50,0.72)';   // I3
  ctx.lineWidth = 1.4;
  ctx.stroke();
  // 放射草纹 5 条
  ctx.strokeStyle = 'rgba(70,62,50,0.55)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI * 0.86 + (Math.PI * 0.72) * (i / 4) + (rng() - 0.5) * 0.08;
    ctx.beginPath();
    ctx.moveTo(x, y - h * 0.18);
    ctx.lineTo(x + Math.cos(a) * w * 0.46, y - h * 0.18 + Math.sin(a) * h * 0.95);
    ctx.stroke();
  }
  // 地面散 3 根稻草
  ctx.strokeStyle = 'rgba(96,86,62,0.5)';
  for (let i = 0; i < 3; i++) {
    const sx = x + (rng() - 0.5) * w * 1.5;
    ctx.beginPath();
    ctx.moveTo(sx, y + 1);
    ctx.lineTo(sx + (rng() - 0.5) * 7, y + 1 + (rng() - 0.5) * 2.5);
    ctx.stroke();
  }
  ctx.restore();
}

/**
 * L2-3 远景摊位剪影：矮摊（顶棚线 + 两根竖杆 + 货品 3 小弧），I4 淡线。
 * 目的只有一个——背景不空。
 */
function drawSc_Stall(ctx, s) {
  const x = s.x;
  const y = s.y;
  const w = s.w || 40;
  const h = s.h || 22;
  ctx.save();
  ctx.strokeStyle = 'rgba(90,84,70,0.38)';   // I4
  ctx.lineWidth = 1.1;
  // 顶棚：略斜的一条，两端微微翘（不是标准矩形，避免读成建筑图）
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y - h * 0.55);
  ctx.quadraticCurveTo(x, y - h * 0.86, x + w / 2, y - h * 0.55);
  ctx.stroke();
  // 两根竖杆
  ctx.beginPath();
  ctx.moveTo(x - w / 2 + 3, y - h * 0.56); ctx.lineTo(x - w / 2 + 3, y);
  ctx.moveTo(x + w / 2 - 3, y - h * 0.56); ctx.lineTo(x + w / 2 - 3, y);
  ctx.stroke();
  // 货品：台面上 3 个小弧
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const gx = x - w * 0.28 + (w * 0.28) * i;
    ctx.moveTo(gx - 3.6, y - 1);
    ctx.quadraticCurveTo(gx, y - 6.2, gx + 3.6, y - 1);
  }
  ctx.stroke();
  ctx.restore();
}

/**
 * L2-4 沟沿木桩 + 垂绳：强化「别掉下去」。
 * posts: [[x,y],...] 的世界坐标；桩间连一条下垂的绳（贝塞尔 2 笔）。
 */
function drawSc_Stakes(ctx, s, tier) {
  ctx.save();
  // 垂绳先画（在桩后面）
  if (tier !== 'low' && s.rope) {
    const [a, b] = s.rope;
    ctx.strokeStyle = 'rgba(70,62,50,0.6)';   // I3
    ctx.lineWidth = 1.1;
    const sag = s.sag || 12;
    ctx.beginPath();
    ctx.moveTo(a[0], a[1] + 2);
    ctx.quadraticCurveTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + sag, b[0], b[1] + 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(70,62,50,0.34)';
    ctx.beginPath();
    ctx.moveTo(a[0], a[1] + 4);
    ctx.quadraticCurveTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + sag + 3, b[0], b[1] + 4);
    ctx.stroke();
  }
  for (const p of s.posts || []) {
    const [px, py] = p;
    // 桩身：短竖（略斜）
    ctx.strokeStyle = '#5B5344';              // I2
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + 1.2, py - (s.h || 12));
    ctx.stroke();
    // 斜帽：桩顶被敲过的小斜面
    ctx.strokeStyle = 'rgba(70,62,50,0.72)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(px - 2.6, py - (s.h || 12) - 1.5);
    ctx.lineTo(px + 3.6, py - (s.h || 12) + 1.4);
    ctx.stroke();
  }
  ctx.restore();
}

/**
 * L2-5 收货口棚布升级：褶线 4 条 + 边缘扇贝 6 弧 + C5 微赭 wash。
 * 让漏斗读成"软棚布"而不是"木框"。
 */
function drawSc_CanopyFold(ctx, s, tier) {
  const x = s.x;
  const y = s.y;
  const w = s.w || 80;
  const h = s.h || 16;
  ctx.save();
  // 微赭 wash（A2 调性，极淡）
  ctx.fillStyle = 'rgba(196,150,96,0.10)';    // A2
  ctx.fillRect(x - w / 2, y - h / 2, w, h);
  // 褶线 4 条：放射状，从中心向两侧散开
  ctx.strokeStyle = 'rgba(90,80,64,0.35)';
  ctx.lineWidth = 1.1;
  for (let i = 0; i < 4; i++) {
    const fx = x - w / 2 + (w / 5) * (i + 1);
    ctx.beginPath();
    ctx.moveTo(fx, y - h / 2 + 1);
    ctx.lineTo(fx + (fx - x) * 0.12, y + h / 2 - 1);
    ctx.stroke();
  }
  // 扇贝边 6 弧（低档删）
  if (tier !== 'low') {
    ctx.strokeStyle = 'rgba(96,86,62,0.55)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    const n = 6;
    for (let i = 0; i < n; i++) {
      const ax = x - w / 2 + (w / n) * i;
      ctx.moveTo(ax, y + h / 2 - 1);
      ctx.quadraticCurveTo(ax + w / (n * 2), y + h / 2 + 3.4, ax + w / n, y + h / 2 - 1);
    }
    ctx.stroke();
  }
  ctx.restore();
}

/**
 * L2-1 布幡：杆 + 三角旗（静态底）。旗面本身由 drawAm_Pennant 每帧摆动，
 * 这里只画杆与旗的固定锚点，避免静态层里出现"待动的旗"。
 */
function drawSc_PennantPole(ctx, s) {
  ctx.save();
  ctx.strokeStyle = '#5B5344';                // I2
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(s.x, s.y);
  ctx.lineTo(s.x, s.y - (s.h || 60));
  ctx.stroke();
  ctx.restore();
}

/**
 * L3-1 水面（静态部分）：不规则水塘 W0 底 + W2 水平波纹。
 * 高光由 drawAm_WaterGlint 每帧轻微平移。
 */
function drawSc_Water(ctx, s, seedKey) {
  const rng = makeRng(hashStr((seedKey || 'water') + ':water'));
  const x = s.x;
  const y = s.y;
  const w = s.w || 92;
  const h = s.h || 90;
  ctx.save();
  // 水面：上下沿不是直线（用二次曲线做出水塘的不规则轮廓）
  ctx.beginPath();
  ctx.moveTo(x - w / 2, y);
  ctx.quadraticCurveTo(x - w * 0.2, y - 4, x + w * 0.16, y - 1);
  ctx.quadraticCurveTo(x + w * 0.5, y + 3, x + w / 2, y + h * 0.5);
  ctx.lineTo(x + w / 2 - 4, y + h);
  ctx.quadraticCurveTo(x, y + h + 5, x - w / 2 + 3, y + h * 0.72);
  ctx.closePath();
  ctx.fillStyle = 'rgba(150,178,168,0.30)';   // W0
  ctx.fill();
  ctx.strokeStyle = 'rgba(110,140,132,0.45)'; // W2
  ctx.lineWidth = 1.2;
  ctx.stroke();
  // 水平波纹 3–5 条
  ctx.strokeStyle = 'rgba(110,140,132,0.45)';
  ctx.lineWidth = 1;
  const n = 3 + Math.floor(rng() * 3);
  for (let i = 0; i < n; i++) {
    const wy = y + 10 + (h - 20) * ((i + 0.5) / n) + (rng() - 0.5) * 6;
    const wx = x - w / 2 + 8 + rng() * (w * 0.3);
    const ww = w * (0.28 + rng() * 0.34);
    ctx.beginPath();
    ctx.moveTo(wx, wy);
    ctx.quadraticCurveTo(wx + ww / 2, wy - 2.2, wx + ww, wy);
    ctx.stroke();
  }
  ctx.restore();
}

/**
 * L3-2 芦苇 / 香蒲：杆（I3 竖）+ 2–3 片叶（斜线）+ 香蒲头（短粗棒 E1）。
 * 摆动由 drawAm_Reeds 处理（只摆 s.sway 指定的 2 根）。
 */
function drawSc_Reeds(ctx, s, seedKey) {
  const rng = makeRng(hashStr((seedKey || 'reed') + ':reed'));
  const n = s.n || 7;
  ctx.save();
  for (let i = 0; i < n; i++) {
    const rx = s.x1 + (s.x2 - s.x1) * (n === 1 ? 0.5 : i / (n - 1)) + (rng() - 0.5) * 5;
    const hh = (s.h || 30) * (0.72 + rng() * 0.5);
    const lean = (rng() - 0.5) * 5;
    const swayIdx = (s.sway || []).indexOf(i);
    // 杆
    ctx.strokeStyle = 'rgba(70,62,50,0.72)';   // I3
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(rx, s.y);
    ctx.quadraticCurveTo(rx + lean * 0.4, s.y - hh * 0.6, rx + lean, s.y - hh);
    ctx.stroke();
    // 叶 2–3 片
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(70,62,50,0.55)';
    for (let k = 0; k < 2 + (rng() > 0.5 ? 1 : 0); k++) {
      const ly = s.y - hh * (0.4 + k * 0.22);
      const dir = k % 2 ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(rx + lean * (0.4 + k * 0.22), ly);
      ctx.quadraticCurveTo(rx + dir * 7, ly - 3, rx + dir * 11, ly - 6.5);
      ctx.stroke();
    }
    // 香蒲头：短粗棒（E1 填 + I3 描）
    if (swayIdx >= 0 || rng() > 0.45) {
      const hx = rx + lean;
      const hy = s.y - hh;
      ctx.beginPath();
      ctx.ellipse(hx, hy - 4, 1.9, 5.2, lean * 0.02, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(120,104,74,0.30)'; // E1
      ctx.fill();
      ctx.strokeStyle = 'rgba(70,62,50,0.72)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
  ctx.restore();
}

/**
 * L3-4 泵体锈迹 + 苔藓 + 出水口滴线：让泵有"三十年了"的旧感。
 */
function drawSc_Rust(ctx, s, tier) {
  ctx.save();
  // 锈迹 3 条竖短折线（C5 @.5 —— 赭红，允许饱和但面积极小）
  ctx.strokeStyle = 'rgba(166,96,58,0.5)';
  ctx.lineWidth = 1.4;
  const rx = s.x - s.w / 2 + 6;
  for (let i = 0; i < 3; i++) {
    const px = rx + (s.w - 12) * (0.22 + 0.3 * i);
    const py = s.y - s.h / 2 + 8;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + 1.6, py + 8);
    ctx.lineTo(px - 1.2, py + 15);
    ctx.stroke();
  }
  // 苔藓 3 团（C0 @.35，低档删）
  if (tier !== 'low') {
    ctx.fillStyle = 'rgba(63,107,79,0.35)';    // C0
    for (let i = 0; i < 3; i++) {
      const mx = s.x - s.w / 2 + 10 + (s.w - 20) * (i / 2);
      ctx.beginPath();
      ctx.arc(mx, s.y + s.h / 2 - 3, 3.4, Math.PI, Math.PI * 2);
      ctx.fill();
    }
  }
  // 出水口滴线 1 条（W2）
  if (s.drip) {
    ctx.strokeStyle = 'rgba(110,140,132,0.45)'; // W2
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(s.drip[0], s.drip[1]);
    ctx.lineTo(s.drip[0] + 0.8, s.drip[1] + 9);
    ctx.stroke();
  }
  ctx.restore();
}

/**
 * L3-5 干裂纹：主干 1 条 + 3–4 条分叉（E5）+ 2–3 块翘起土片（E0 + I2）。
 * 低档只画主干。
 */
function drawSc_Cracks(ctx, s, seedKey, tier) {
  const rng = makeRng(hashStr((seedKey || 'crack') + ':crack'));
  ctx.save();
  ctx.strokeStyle = 'rgba(70,58,44,0.60)';    // E5
  ctx.lineWidth = 1.2;
  const branches = tier === 'low' ? 0 : 3 + Math.floor(rng() * 2);
  for (let b = 0; b <= branches; b++) {
    const isMain = b === 0;
    const sx = s.x1 + (s.x2 - s.x1) * (isMain ? 0.12 : 0.3 + rng() * 0.62);
    const sy = s.y + (rng() - 0.5) * 6;
    const segs = isMain ? 4 : 2;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    let px = sx;
    let py = sy;
    const dirX = isMain ? 1 : (rng() - 0.5) * 1.4;
    for (let k = 0; k < segs; k++) {
      px += ((s.x2 - s.x1) / segs) * 0.55 * dirX + (rng() - 0.5) * 4;
      py += (rng() - 0.5) * 7;
      ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  // 翘起土片（低档删）
  if (tier !== 'low') {
    for (let i = 0; i < 3; i++) {
      const fx = s.x1 + (s.x2 - s.x1) * (0.2 + rng() * 0.6);
      const fy = s.y + 6 + rng() * 12;
      ctx.beginPath();
      ctx.moveTo(fx - 5, fy);
      ctx.lineTo(fx, fy - 3.2);
      ctx.lineTo(fx + 5, fy + 0.6);
      ctx.closePath();
      ctx.fillStyle = '#CFC3A6';              // E0
      ctx.fill();
      ctx.strokeStyle = '#5B5344';            // I2
      ctx.lineWidth = 0.9;
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════════════════════
 * 动态层（每帧 · 纯 canvas · 禁 rough）
 *
 * 预算（art-polish 6.3）：风 ≤4 / 水光 ≤3 / 涟漪 ≤2 / 布幡+芦苇 ≤3，合计 ≤12 笔/帧。
 * 全部在 drawAmbient 里统一裁剪到 0..BOOK_TOP——动效永不越界进造物簿。
 * ══════════════════════════════════════════════════════════════════════════ */

/** 风：2–3 条横向短线匀速右漂 + 1 片飘叶。超出右边界后从左侧回收（无分配、无状态） */
function drawAm_Wind(ctx, s, t) {
  const n = 3;
  const y0 = s.y || 250;
  ctx.save();
  ctx.strokeStyle = 'rgba(120,110,90,0.35)';
  ctx.lineWidth = 1.2;
  ctx.setLineDash([9, 7]);
  for (let i = 0; i < n; i++) {
    const period = 6.5 + i * 1.7;                       // 各线速度不同，避免整齐得像传送带
    const phase = ((t / period) + i * 0.37) % 1;
    const len = 24 + i * 8;
    const x = -len + phase * (DESIGN_W_AM + len * 2);
    const y = y0 + i * 26 + Math.sin(t * 0.7 + i) * 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
  // 飘叶：1 片小弧，走一条缓慢的横向+上下摆动轨迹
  const lp = (t / 11) % 1;
  const lx = -20 + lp * (DESIGN_W_AM + 40);
  const ly = y0 + 58 + Math.sin(t * 1.3) * 9;
  ctx.strokeStyle = 'rgba(96,86,62,0.5)';
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(lx, ly);
  ctx.quadraticCurveTo(lx + 5, ly - 3.4, lx + 10, ly);
  ctx.quadraticCurveTo(lx + 5, ly + 2.6, lx, ly);
  ctx.stroke();
  ctx.restore();
}

/** 水面高光：3 段短杠，随时间正弦平移 ±1.5px（低档由调用方跳过） */
function drawAm_WaterGlint(ctx, s, t) {
  const w = s.w || 92;
  ctx.save();
  ctx.strokeStyle = 'rgba(240,246,240,0.55)';   // W1
  ctx.lineWidth = 1.6;
  for (let i = 0; i < 3; i++) {
    const gy = s.y + 18 + (s.h || 90) * 0.24 * i;
    const gx = s.x - w * 0.24 + Math.sin(t * 0.9 + i * 2.1) * 1.5;
    ctx.beginPath();
    ctx.moveTo(gx, gy);
    ctx.lineTo(gx + w * (0.26 - i * 0.04), gy);
    ctx.stroke();
  }
  ctx.restore();
}

/** 涟漪：2 个同心椭圆环，半径 6→18 周期扩散 + alpha 0.45→0 淡出（错相位） */
function drawAm_Ripple(ctx, s, t) {
  ctx.save();
  ctx.strokeStyle = 'rgba(110,140,132,0.45)';   // W2
  ctx.lineWidth = 1.2;
  for (let i = 0; i < 2; i++) {
    const p = ((t / 2.6) + i * 0.5) % 1;
    const r = 6 + p * 12;
    ctx.globalAlpha = 0.45 * (1 - p);
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, r, r * 0.42, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/** 布幡：三角旗，旗尖随时间 ±3px 摆（静态杆由 drawSc_PennantPole 画） */
function drawAm_Pennant(ctx, s, t) {
  const top = s.y - (s.h || 60);
  ctx.save();
  for (let i = 0; i < (s.flags || 2); i++) {
    const fy = top + 6 + i * 13;
    const swing = Math.sin(t * 1.9 + i * 1.3) * 3;
    ctx.beginPath();
    ctx.moveTo(s.x, fy);
    ctx.lineTo(s.x + 20, fy + 4 + swing * 0.5);
    ctx.lineTo(s.x, fy + 11);
    ctx.closePath();
    ctx.fillStyle = 'rgba(166,96,58,0.7)';      // C5 @.7
    ctx.fill();
    ctx.strokeStyle = '#5B5344';                // I2
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
  ctx.restore();
}

/** 芦苇摆动：只摆 s.sway 指定的 2 根，顶部 ±1.5px */
function drawAm_ReedsSway(ctx, s, t) {
  const n = s.n || 7;
  ctx.save();
  ctx.strokeStyle = 'rgba(70,62,50,0.6)';
  ctx.lineWidth = 1.3;
  for (const i of s.sway || []) {
    const rx = s.x1 + (s.x2 - s.x1) * (n === 1 ? 0.5 : i / (n - 1));
    const hh = (s.h || 30) * 0.95;
    const tipX = rx + Math.sin(t * 1.5 + i) * 1.5;
    ctx.beginPath();
    ctx.moveTo(rx, s.y - hh * 0.55);
    ctx.quadraticCurveTo(rx, s.y - hh * 0.8, tipX, s.y - hh);
    ctx.stroke();
  }
  ctx.restore();
}

/** 场景带宽（与 config DESIGN_W 一致；此处避免再引入一层 import 依赖） */
const DESIGN_W_AM = 430;

/**
 * 动态布景统一入口（art-polish 第九章）：在 drawBodies 之后、drawBook 之前调用。
 * 内部裁剪到 0..BOOK_TOP——动效绝不越界进造物簿。
 * @param {number} t 秒
 * @param {string} tier 'low' | 'mid' | 'high'；low 档只保留农夫相关，环境动效全关
 */
function drawAmbient(ctx, level, t, tier, bookTop) {
  if (!level || !level.scenery) return;
  if (tier === 'low') return;                  // 6.3：low 档环境动效全关
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, DESIGN_W_AM, bookTop || 513);
  ctx.clip();
  for (const s of level.scenery) {
    if (s.kind === 'wind') drawAm_Wind(ctx, s, t);
    else if (s.kind === 'water') drawAm_WaterGlint(ctx, s, t);
    else if (s.kind === 'ripple') drawAm_Ripple(ctx, s, t);
    else if (s.kind === 'pennant') drawAm_Pennant(ctx, s, t);
    else if (s.kind === 'reeds') drawAm_ReedsSway(ctx, s, t);
  }
  ctx.restore();
}

/* src/render/title-card.js */
/**
 * src/render/title-card.js —— 开场扉页（Title Card）
 *
 * 中英主次（见 docs/naming.md 的接线清单）：
 *   · 中文《我是造物主》= 主视觉：48px 宋体，逐字绘制 + 交替微旋 + 基线起伏，
 *     模拟手写落笔的歪斜感（一次性静态字，不用字体文件，零网络请求）。
 *   · 英文 SKETCHSMITH = 副行：13px、字距拉开、淡墨。它是「署名」不是「标题」，
 *     所以不跟中文抢视觉重量。
 *   · tagline = 第三行，最淡。
 *
 * 纯函数式绘制：alpha / now 由调用方（main.js）持有，本模块不持状态、不读时钟、不注册监听。
 * 无导入依赖（除版式常量），可在离屏层或主画布上任意调用。
 */


const INK = '#38312a';
const INK_MID = 'rgba(56,49,42,0.66)';
const INK_SOFT = 'rgba(56,49,42,0.38)';
const PAPER = '#efe7d6';
const SEAL = 'rgba(166,62,46,0.78)';
/** 宋体系：macOS 宋体 → Noto/Source Han Serif → 通用 serif（Windows 上落到 SimSun） */
const CN_FONT = '"Songti SC","Noto Serif SC","Source Han Serif SC",serif';
const UI_FONT = 'system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';

/** 一条带手抖的墨线（确定性：抖幅由 seed 定相位，不随时间变化） */
function inkLine(ctx, x1, x2, y, seed, color) {
  ctx.strokeStyle = color || INK_MID;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  const n = 14;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const x = x1 + (x2 - x1) * t;
    const dy = Math.sin(t * 7.3 + seed) * 0.9 + Math.sin(t * 2.1 + seed * 1.7) * 0.6;
    if (i === 0) ctx.moveTo(x, y + dy);
    else ctx.lineTo(x, y + dy);
  }
  ctx.stroke();
}

/** 逐字左对齐绘制并拉开字距（canvas 的 letterSpacing 在旧内核不可靠） */
function trackedText(ctx, text, cx, y, track, font, color) {
  ctx.font = font;
  const ws = [];
  let total = 0;
  for (const ch of text) {
    const w = ctx.measureText(ch).width;
    ws.push(w);
    total += w + track;
  }
  total -= track;
  let x = cx - total / 2;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  for (let i = 0; i < text.length; i++) {
    ctx.fillText(text[i], x, y);
    x += ws[i] + track;
  }
  return total;
}

/**
 * @param {CanvasRenderingContext2D} ctx  已处于 design 坐标系（430×932）
 * @param {{alpha?:number, now?:number}} opt
 */
function drawTitleCard(ctx, opt) {
  const o = opt || {};
  const alpha = Math.max(0, Math.min(1, o.alpha == null ? 1 : o.alpha));
  if (alpha <= 0.002) return;
  const now = o.now || 0;

  ctx.save();
  ctx.globalAlpha = alpha;

  // ── 纸底：整屏盖住，避免与关卡画面抢读 ──
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);

  // 稿纸横线：极淡，给「练习本扉页」的质感（不是装饰，是让空白不透成灰）
  ctx.strokeStyle = 'rgba(56,49,42,0.05)';
  ctx.lineWidth = 1;
  for (let y = 132; y < DESIGN_H - 96; y += 38) {
    ctx.beginPath();
    ctx.moveTo(30, y + 0.5);
    ctx.lineTo(DESIGN_W - 30, y + 0.5);
    ctx.stroke();
  }

  // ── 版框：上下两条手抖长线 ──
  // 上留白 98px / 下留白 76px：按「书名页」习惯顶部呼吸略大于底部，
  // 下框不能贴住 tagline（初版 520 时只差 30px，标题块被读成往下挤）。
  inkLine(ctx, 46, DESIGN_W - 46, 250, 1.3);
  inkLine(ctx, 46, DESIGN_W - 46, 540, 2.7);

  // ── 中文主视觉：48px 宋体，逐字微旋 + 基线起伏 ──
  const CN = '我是造物主';
  const SIZE = 48;
  const TRACK = 5;
  ctx.font = `700 ${SIZE}px ${CN_FONT}`;
  const ws = [];
  let total = 0;
  for (const ch of CN) {
    const w = ctx.measureText(ch).width;
    ws.push(w);
    total += w + TRACK;
  }
  total -= TRACK;
  const DIP = [0, -1.6, 1.1, -0.6, 1.5, 0];
  let x = (DESIGN_W - total) / 2;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < CN.length; i++) {
    ctx.save();
    ctx.translate(x + ws[i] / 2, 372 + DIP[i % DIP.length]);
    ctx.rotate((i % 2 === 0 ? -1 : 1) * 0.011);
    ctx.fillStyle = INK;
    ctx.fillText(CN[i], 0, 0);
    ctx.restore();
    x += ws[i] + TRACK;
  }

  // 中文与英文之间的短分隔：一小段墨线 + 两端点
  inkLine(ctx, DESIGN_W / 2 - 46, DESIGN_W / 2 + 46, 410, 4.1, INK_SOFT);
  ctx.fillStyle = INK_SOFT;
  ctx.beginPath();
  ctx.arc(DESIGN_W / 2 - 52, 410, 1.6, 0, Math.PI * 2);
  ctx.arc(DESIGN_W / 2 + 52, 410, 1.6, 0, Math.PI * 2);
  ctx.fill();

  // ── 英文副行：署名，不抢主视觉 ──
  trackedText(ctx, 'SKETCHSMITH', DESIGN_W / 2, 438, 6, `600 13px ${UI_FONT}`, INK_MID);

  // ── tagline ──
  ctx.font = `italic 11px ${CN_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = INK_SOFT;
  ctx.fillText('Draw it. Bless it. See if it holds.', DESIGN_W / 2, 464);

  // ── 印章：右下角「造」，给中味落款 ──
  const sx = DESIGN_W - 62;
  const sy = 540 - 38;   // 完整落在下框线之上，不骑线（骑线会读成「盖歪了」而非「随手盖的」）
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(0.045);
  ctx.strokeStyle = SEAL;
  ctx.lineWidth = 1.6;
  ctx.strokeRect(-15.5, -15.5, 31, 31);
  ctx.fillStyle = SEAL;
  ctx.font = `700 17px ${CN_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('造', 0, 0.5);
  ctx.restore();

  // ── 底部提示：呼吸明暗，告诉玩家可以点 ──
  const breath = 0.5 + 0.5 * Math.sin(now / 420);
  ctx.font = `12px ${UI_FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = `rgba(56,49,42,${(0.30 + 0.30 * breath).toFixed(3)})`;
  ctx.fillText('点一下就开始', DESIGN_W / 2, 826);
  ctx.font = `10px ${UI_FONT}`;
  ctx.fillStyle = `rgba(56,49,42,${(0.18 + 0.16 * breath).toFixed(3)})`;
  ctx.fillText('tap to begin', DESIGN_W / 2, 848);

  ctx.restore();
}
;
/* src/render/about.js */
/**
 * src/render/about.js —— 「关于 / 许可」浮层
 *
 * 为什么要有：MIT 要求「保留版权与许可声明」，而许可正文目前只躺在产物的那个
 * text/plain 许可块里——合规但玩家看不到。这里给一个能点到的入口，
 * 把「谁做的 / 什么许可 / 用了谁的库」摊开写清楚。
 *
 * 纯绘制 + 布局常量，无状态、无监听；开关状态由 main.js 的 view.about 持有。
 *
 * ⚠️ 顶层名一律加 ABT_ 前缀：本项目走 fallback-concat（纯拼接，无模块作用域隔离），
 * 构建门禁 D3 会拦「顶层名重复」。INK / roundRect 这些通用名会与 title-card.js、hud.js 撞。
 */


const ABT_INK = '#38312a';
const ABT_INK_MID = 'rgba(56,49,42,0.70)';
const ABT_INK_SOFT = 'rgba(56,49,42,0.46)';
const ABT_CARD = '#f7f2e4';
const ABT_UI = 'system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
const ABT_SERIF = '"Songti SC","Noto Serif SC","Source Han Serif SC",serif';

/** 卡片几何（main.js 的命中判定与绘制共用，避免两处写死坐标对不上） */
const ABOUT_CARD = { x: 40, y: 236, w: DESIGN_W - 80, h: 372 };
/** 「知道了」按钮 */
function aboutCloseRect() {
  return { x: DESIGN_W / 2 - 54, y: ABOUT_CARD.y + ABOUT_CARD.h - 56, w: 108, h: 34 };
}

function abtRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** 左侧标签 + 右侧值，返回下一行的 y */
function abtKv(ctx, label, value, y, x) {
  ctx.font = `11px ${ABT_UI}`;
  ctx.fillStyle = ABT_INK_SOFT;
  ctx.textAlign = 'left';
  ctx.fillText(label, x, y);
  ctx.font = `12px ${ABT_UI}`;
  ctx.fillStyle = ABT_INK;
  ctx.fillText(value, x + 46, y);
  return y + 22;
}

/**
 * @param {CanvasRenderingContext2D} ctx  design 坐标系

/**
 * src/render/hud.js —— HUD 与按钮命中（零物理、零平台 API）
 * 版式约束（阶段2 评审 P1-2/P2-4）：
 *   · 头部 ≤96px：标题 / 副标题 / 芯片同行，开发注记只在 ?debug=1 里出现
 *   · 场景 ≥360px：BOOK_TOP=513，场景占 96–513
 *   · 调试 HUD 做成右上角半透明小块，不与主角区域重叠
 */



const HUD_CHIP_W = 66;
const HUD_CHIP_H = 34;
const HUD_CHIP_GAP = 6;
const HUD_CHIP_Y = 8;
const HUD_PAD = 12;

const ABILITY_LABELS = {
  harden: '变硬', roll: '会滚', heavy: '变重', light: '变轻', tickle: '怕痒',
};

/**
 * 手绘感圆角矩形路径（art-polish 3.5）：四边各带 ±0.45px 的**确定性**微抖。
 * 确定性是硬要求：芯片每帧重画，抖动若随机，芯片会整帧"跳舞"。
 * seed 由调用方传（建议 chip index），同一枚芯片每帧笔迹一致。
 */
function wobblyRectPath(ctx, x, y, w, h, r, seed) {
  let s = (seed * 2654435761 + 1) >>> 0;
  const j = () => {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return (s / 4294967296 - 0.5) * 0.9;
  };
  ctx.moveTo(x + r + j(), y + j());
  ctx.lineTo(x + w - r + j(), y + j());
  ctx.quadraticCurveTo(x + w + j(), y + j(), x + w + j(), y + r + j());
  ctx.lineTo(x + w + j(), y + h - r + j());
  ctx.quadraticCurveTo(x + w + j(), y + h + j(), x + w - r + j(), y + h + j());
  ctx.lineTo(x + r + j(), y + h + j());
  ctx.quadraticCurveTo(x + j(), y + h + j(), x + j(), y + h - r + j());
  ctx.lineTo(x + j(), y + r + j());
  ctx.quadraticCurveTo(x + j(), y + j(), x + r + j(), y + j());
  ctx.closePath();
}

/** 选中下划线（R3 第二通道）：3 段抖动横线——灰化后不靠颜色也认得出选中 */
function wobblyUnderline(ctx, x, y, w, seed) {
  let s = (seed * 40503 + 7) >>> 0;
  const j = () => {
    s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
    return (s / 4294967296 - 0.5) * 0.8;
  };
  const segW = w / 3;
  for (let i = 0; i < 3; i++) {
    ctx.moveTo(x + i * segW + j(), y + j());
    ctx.lineTo(x + (i + 1) * segW - 1.5 + j(), y + j());
  }
}

/** 芯片按「右对齐、与标题同行」排布；n 由当前关卡芯片数决定 */
function chipRect(i, n) {
  // ⚠️ 原来 Math.min(4, n) 把 5 枚钳到 4：第 5 枚（怕痒）直接溢出右边界
  const count = Math.max(1, n || 4);
  // 5 枚起缩窄芯片：66px 一枚时 5 枚总宽 354、右对齐后 x0=64，会压到左侧标题（标题止于 x≈100）；
  // 56px 一枚时总宽 304、x0=114，与标题不重叠
  const w = count > 4 ? 56 : HUD_CHIP_W;
  const total = count * w + (count - 1) * HUD_CHIP_GAP;
  const x0 = DESIGN_W - HUD_PAD - total;
  return { x: x0 + i * (w + HUD_CHIP_GAP), y: HUD_CHIP_Y, w, h: HUD_CHIP_H };
}

function chipIndexAt(x, y, n) {
  // ⚠️ 原来 i < 4 写死：第 5 枚芯片看得见却**点不到**（关5/沙盒的「怕痒」由此失灵）
  const count = Math.max(1, n || 4);
  for (let i = 0; i < count; i++) {
    const r = chipRect(i, n);
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
  }
  return -1;
}

function buttonAt(x, y) {
  return null;   // 重来/声音按钮已挪进标题行下方 40 内，见 drawHud 的 hitRect
}

/** 标题行右下角的三个小按钮命中区（与 drawHud 中的绘制保持一致） */
function headerButtonAt(x, y) {
  if (y < 52 || y > 92) return null;
  if (x > DESIGN_W - 46 && x < DESIGN_W - 10) return 'audio';
  if (x > DESIGN_W - 96 && x < DESIGN_W - 50) return 'retry';
  if (x > DESIGN_W - 152 && x < DESIGN_W - 100) return 'about';
  return null;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.closePath();
}

function drawHud(ctx, view) {
  const snap = view.snapshot || {};
  const chips = snap.chips || view.level.chips || [];
  ctx.save();
  ctx.textBaseline = 'alphabetic';

  // ---- 头部（≤96px）：标题 + 副标题在左，芯片在右，同一行带 ----
  ctx.fillStyle = '#2b2620';
  ctx.font = '700 19px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(snap.title || view.level.title, 20, 30);
  ctx.fillStyle = '#7a6f5e';
  ctx.font = '11px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  // 沙盒没有关号、也没有「过关」这回事 ⇒ 不显示「第 N 关」，只显示「造物园」
  const headLabel = (view.level && view.level.id === 'sandbox')
    ? '造物园'
    : ('第 ' + (view.levelIndex + 1) + ' 关 / ' + (view.totalLevels || 5));
  ctx.fillText(headLabel + '　' + (view.level.subtitle || ''), 20, 48);

  const armed = snap.armedAbilities || [];
  // ⚠️ 原来还有个 && i < 4 写死：第 5 枚芯片（怕痒）永远画不出来。上限交给 chipRect 的宽度适配
  for (let i = 0; i < chips.length; i++) {
    const r = chipRect(i, chips.length);
    const id = chips[i];
    const on = armed.indexOf(id) >= 0;
    ctx.fillStyle = on ? '#3f6b4f' : 'rgba(246,241,227,0.95)';
    ctx.beginPath();
    wobblyRectPath(ctx, r.x, r.y, r.w, r.h, 9, i + 1);
    ctx.fill();
    ctx.strokeStyle = on ? '#2c4a37' : 'rgba(90,80,64,0.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 手绘双趟（art-polish 3.5）：第二趟偏移 0.6px、alpha 减半；low 档省掉
    if (RenderQuality.tier !== 'low') {
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.translate(0.6, 0.5);
      ctx.beginPath();
      wobblyRectPath(ctx, r.x, r.y, r.w, r.h, 9, i + 7);
      ctx.stroke();
      ctx.restore();
    }
    // R3 第二通道：选中态除颜色外叠加「下划线 3 段 + 右上小勾」，灰化后仅凭形状可辨
    if (on) {
      ctx.strokeStyle = '#2c4a37';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      wobblyUnderline(ctx, r.x + 9, r.y + 27, r.w - 22, i + 3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(r.x + r.w - 13, r.y + 11);
      ctx.lineTo(r.x + r.w - 9.5, r.y + 14);
      ctx.lineTo(r.x + r.w - 4.5, r.y + 6);
      ctx.stroke();
    }
    ctx.fillStyle = on ? '#f4efe2' : '#3a352c';
    ctx.font = '600 14px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(ABILITY_LABELS[id] || id, r.x + 11, r.y + 22);
  }

  // 重来 / 声 / 关于：标题行下方，不与场景争位置；与芯片同一手绘语言（双趟抖动）
  const drawWobblyBtn = (x, w, seed) => {
    ctx.strokeStyle = 'rgba(90,80,64,0.45)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    wobblyRectPath(ctx, x, 54, w, 34, 8, seed);
    ctx.stroke();
    if (RenderQuality.tier !== 'low') {
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.translate(0.6, 0.5);
      ctx.beginPath();
      wobblyRectPath(ctx, x, 54, w, 34, 8, seed + 11);
      ctx.stroke();
      ctx.restore();
    }
  };
  drawWobblyBtn(DESIGN_W - 150, 50, 21);
  drawWobblyBtn(DESIGN_W - 96, 46, 22);
  drawWobblyBtn(DESIGN_W - 46, 36, 23);
  ctx.fillStyle = '#5d5446';
  ctx.font = '12px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('关于', DESIGN_W - 137, 76);
  ctx.fillText('重来', DESIGN_W - 88, 76);
  ctx.fillText(view.audioOn ? '声' : '静', DESIGN_W - 34, 76);

  // ---- 失败提示（只在场景上沿，不压地形）----
  // 提示项可以是字符串，也可以是 {beam, other}：**按玩家上一次造出来的形态分岔**（关1 在用）。
  // 【禁止话术·写死在这里】不许出现「再试」「画长一点」「画得不对」「够不着」「顶」
  //   —— 提示要否掉方向，不要否掉玩家的手法；后者会让他在错误方向上更努力。
  const hints = view.level.failHints || [];
  if (snap.hintLevel > 0 && hints.length) {
    const t = pickFailHint(hints, snap.hintLevel, snap.creature && snap.creature.form);
    ctx.fillStyle = 'rgba(120,40,32,0.92)';
    ctx.font = '12px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    wrapText(ctx, t || '', 20, 100, DESIGN_W - 40, 16);
  }

  // ---- 对话气泡（放在天空带 y≈296，绝不压地面/沟/农夫）----
  if (view.bubble && view.bubble.until > view.now) {
    const b = view.bubble;
    ctx.font = '14px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    const text = b.text || '';
    const w = Math.min(DESIGN_W - 40, Math.max(130, ctx.measureText(text).width + 28));
    const x = 20;
    const y = 296;
    ctx.fillStyle = 'rgba(250,246,236,0.96)';
    ctx.strokeStyle = 'rgba(90,80,64,0.5)';
    ctx.lineWidth = 1.4;
    roundRect(ctx, x, y, w, 50, 12); ctx.fill(); ctx.stroke();
    // 小尾巴：指向左岸的农夫（气泡在天空带，读者要知道是谁在说话）
    ctx.beginPath();
    ctx.moveTo(x + 34, y + 48);
    ctx.lineTo(x + 46, y + 62);
    ctx.lineTo(x + 52, y + 47);
    ctx.closePath();
    ctx.fillStyle = 'rgba(250,246,236,0.96)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(90,80,64,0.5)';
    ctx.beginPath(); ctx.moveTo(x + 34, y + 49); ctx.lineTo(x + 46, y + 62); ctx.lineTo(x + 52, y + 48); ctx.stroke();
    ctx.fillStyle = '#6b6050';
    ctx.font = '11px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(b.who || '', x + 14, y + 17);
    ctx.fillStyle = '#2b2620';
    ctx.font = '14px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(text, x + 14, y + 37);
    if (view.voiceMode === 'bubble') {
      ctx.fillStyle = 'rgba(120,110,90,0.6)';
      ctx.font = '10px system-ui';
      ctx.fillText('（无中文语音 · 气泡模式）', x + 14, y + 47);
    }
  }

  // ---- 失败闪红 ----
  if (view.failFlash > 0) {
    ctx.fillStyle = 'rgba(178,58,44,' + (0.16 * view.failFlash).toFixed(3) + ')';
    ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);
  }

  // ---- 过关覆盖层 ----
  if (view.win) {
    ctx.fillStyle = 'rgba(24,22,18,0.55)';
    ctx.fillRect(0, 0, DESIGN_W, DESIGN_H);
    ctx.fillStyle = '#f7f2e4';
    ctx.font = '700 34px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    const isLast = view.levelIndex >= ((view.totalLevels || 3) - 1);
    const title = isLast ? '第一章 · 过完了' : '过关';
    const tw = ctx.measureText(title).width;
    ctx.fillText(title, (DESIGN_W - tw) / 2, 400);
    ctx.font = '14px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
    const sub = isLast ? '点一下进造物园（想造什么就造什么）' : '点一下继续';
    const sw = ctx.measureText(sub).width;
    ctx.fillStyle = 'rgba(247,242,228,0.75)';
    ctx.fillText(sub, (DESIGN_W - sw) / 2, 434);
  }

  // ---- 造物簿标题 ----
  ctx.fillStyle = 'rgba(90,80,64,0.7)';
  ctx.font = '12px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('造物簿 · 在这里画', 20, BOOK_TOP + 18);
  if (view.livePoints > 0) {
    ctx.fillStyle = 'rgba(90,80,64,0.9)';
    ctx.fillText('采样 ' + view.livePoints + ' 点', DESIGN_W - 92, BOOK_TOP + 18);
  }

  // ---- ?debug=1：右上角半透明小块，不压主角 ----
  if (view.debug) {
    const s = snap.creature;
    const lines = [
      'fps ' + view.fps.toFixed(0) + '  frame ' + view.frameMs.toFixed(1) + 'ms  tier ' + view.tier,
      'bodies ' + view.bodyCount + '  strokes ' + view.strokeCount + '  unlocked ' + view.audioUnlocked,
      'chips [' + chips.join(',') + ']  armed [' + (snap.armedAbilities || []).join(',') + ']',
      s ? ('form ' + s.form + '  deg ' + s.degraded + '  parts ' + s.parts + '  mass ' + s.mass.toFixed(1)) : 'form -',
      s && s.geo ? ('aspect ' + s.geo.aspect.toFixed(2) + '  area ' + s.geo.area.toFixed(0) + '  w/h ' + s.geo.w.toFixed(0) + '/' + s.geo.h.toFixed(0)) : 'geo -',
      s && s.geo ? ('closed ' + s.geo.closed + '  nodes ' + s.geo.nodes + '  combos ' + s.combos.join('/')) : 'combos -',
      snap.propPos ? ('prop ' + snap.propPos.x.toFixed(0) + ',' + snap.propPos.y.toFixed(0)) : 'prop -',
      snap.plate && snap.plate.length ? ('plate ' + snap.plate[0].load.toFixed(1) + '/' + snap.plate[0].threshold + '  hold ' + snap.plate[0].holdMs.toFixed(0) + 'ms') : 'plate -',
      // 位置分开报：B=物理圆心（body.position），R=渲染锚点（drawFarmer 的 cx,cy），feet=脚底 y。
      // 三者关系固定：R === B（渲染直接用 body.position，没有任何偏移），feet = B.y + 14（r=14）。
      // 画面上的人是按脚底放大 1.5× 的，但锚点仍是 B —— 所以"报的位置"和"画的位置"永远同一坐标系。
      (snap.actorPos
        ? ('actor B' + snap.actorPos.x.toFixed(0) + ',' + snap.actorPos.y.toFixed(0) +
           '  R' + snap.actorPos.x.toFixed(0) + ',' + snap.actorPos.y.toFixed(0) +
           '  feet ' + (snap.actorPos.y + 14).toFixed(0))
        : 'actor -') + '  fails ' + snap.failStreak,
      '（本轮只做 4 个能力，其余 20 个未实装）',
    ];
    const bx = 176;
    const bw = DESIGN_W - bx - 12;
    const bh = lines.length * 12 + 12;
    ctx.fillStyle = 'rgba(20,18,14,0.55)';
    roundRect(ctx, bx, 118, bw, bh, 8);
    ctx.fill();
    ctx.font = '10px ui-monospace,Menlo,Consolas,monospace';
    ctx.fillStyle = 'rgba(244,239,226,0.95)';
    for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], bx + 8, 132 + i * 12);
  }

  // ---- ?impactDebug=1：只报本帧 score 与是否被闸门拦下，不报累计次数 ----
  if (view.impactDebug) {
    const d = view.impactDebug;
    ctx.font = '11px ui-monospace,Menlo,Consolas,monospace';
    ctx.fillStyle = d.gated ? 'rgba(150,90,20,0.95)' : 'rgba(30,90,50,0.95)';
    ctx.fillText('impact score ' + d.score.toFixed(3) + '  ' + (d.gated ? 'GATED(' + d.reason + ')' : d.reason), 20, view.debug ? 262 : 120);
  }

  ctx.restore();
}

/**
 * 失败提示的取值（纯函数，便于单测）：字符串直接返回；{beam, other} 按形态分岔。
 * 形态分岔现在只有关1 在用——**关2 已不再按形态分岔**（梁是合法解，去否掉梁的方向就是骗玩家），
 * 但分岔机制本身保留：它是"提示是否真的被说出"的可断言入口。

 * 南瓜"已经停稳"的口径（D25）[待实测标定]
 *   |v| < SETTLE_V px/帧 且 |ω| < SETTLE_W rad/帧，并且**连续** SETTLE_MS 都低于阈值。
 * 为什么要"连续每帧"而不是"首末两帧"：南瓜被慢慢推着爬的时候首末都恰好很慢，
 * 只比两点会把它判成静止 → 判失败 → 重置舞台，而它其实还在局中。
 */
const SETTLE_V = 0.2;
const SETTLE_W = 0.02;
const SETTLE_MS = 1500;          // 90 帧 @60fps
/** 南瓜中心低于此高度 = 已经到沟底（棚布面 470、停稳中心 ≈430） */
const PROP_FLOOR_Y = 400;
/** 台沿 x：南瓜右缘越过它 = 还部分悬空 = 可推进 */
const CHASM_RIM_X = 200;

function clampNum(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

/** 造一个会走会跳的小人（走路小人只服务演出与「他自己会去用它」） */
function spawnWalkerBody(def, world) {
  const body = MATTER_RT.Bodies.circle(def.x, def.y, ACTOR.radius, {
    label: 'actor', friction: ACTOR.friction, frictionAir: ACTOR.frictionAir, restitution: 0,
  });
  body.plugin = body.plugin || {};
  body.plugin.actor = true;            // 供 tickle 等钩子识别「这是小人」做特例处理
  body.plugin.actorTargetX = def.targetX;
  MATTER_RT.Body.setMass(body, ACTOR.mass);
  world.addBody(body);
  return {
    kind: 'walker',
    body,
    start: { x: def.x, y: def.y },
    targetX: def.targetX,
    label: def.label || '小人',
    active: false,      // 造物落地之后才开始走（否则玩家还没画他就掉沟里了）
    jumpCd: 0,
    stuck: 0,
    lastX: def.x,
    pitMs: 0,
    jumping: 0,
    biteCd: 0,
  };
}

/** 走路小人 AI：朝目标走；被挡住（连续 N 帧没位移）就跳一次 */
function stepWalker(a, world, dtMs) {
  const b = a.body;
  if (!a.active) return;
  if (a.jumpCd > 0) a.jumpCd = Math.max(0, a.jumpCd - dtMs);
  let ground = false;
  for (const off of [-6, 0, 6]) {
    const from = { x: b.position.x + off, y: b.position.y + ACTOR.radius - 2 };
    const to = { x: b.position.x + off, y: b.position.y + ACTOR.radius + 8 };
    if (world.raycast(from, to, 2).some((h) => h.body !== b)) { ground = true; break; }
  }
  const standing = ground && b.velocity.y > -1.2 && b.velocity.y < 1.0;
  const dx = a.targetX - b.position.x;
  const dir = Math.abs(dx) > ACTOR.arriveTolerance ? Math.sign(dx) : 0;

  if (standing) {
    // 速度逐步逼近目标速度（不是每帧硬设），否则小人会把桥当推土机推走
    const targetVx = dir * ACTOR.speed;
    const dvx = Math.max(-ACTOR.accelStep, Math.min(ACTOR.accelStep, targetVx - b.velocity.x));
    MATTER_RT.Body.setVelocity(b, { x: b.velocity.x + dvx, y: b.velocity.y });
    if (dir !== 0 && Math.abs(b.position.x - a.lastX) < 0.25) a.stuck++; else a.stuck = 0;
    if (a.stuck >= ACTOR.stuckFrames && a.jumpCd <= 0) {
      MATTER_RT.Body.setVelocity(b, { x: dir * ACTOR.speed * 1.15, y: -ACTOR.jumpSpeed });
      a.jumpCd = ACTOR.jumpCooldownMs;
      a.stuck = 0;
      a.jumping = 300;
    }
  }
  a.lastX = b.position.x;
  if (a.jumping > 0) a.jumping -= dtMs;
}

function createLevelRuntime(opts) {
  const level = opts.level;
  const world = opts.world;
  const bus = opts.bus || { emit() {}, on() {}, countOf() { return 0; } };

  const state = {
    level,
    status: 'playing',      // playing | finished
    elapsedMs: 0,
    failStreak: 0,
    lastFailReason: null,
    hintLevel: 0,
    terrain: [],
    actor: null,
    props: [],
    activeProp: 0,
    plates: [],
    creatures: [],
    activeCreature: null,
    armedAbilities: [],
    degradeLog: [],
    creatureSeq: 0,
    plateFailMark: new Set(),
    actorReadyAt: -1,
    actorResumeAt: -1,
  };

  // ---- 地形 ----
  for (const t of level.terrain) {
    const mat = MATERIALS[t.mat] || MATERIALS.ground;
    const body = MATTER_RT.Bodies.rectangle(t.x, t.y, t.w, t.h, {
      isStatic: true, angle: t.angle || 0, label: 'terrain',
      friction: mat.friction, frictionStatic: mat.frictionStatic, restitution: mat.restitution,
    });
    body.plugin = { mat: t.mat || 'ground', terrain: true };
    world.addBody(body);
    state.terrain.push(body);
  }

  // ---- 移动角色 ----
  if (level.actors && level.actors.length) state.actor = spawnWalkerBody(level.actors[0], world);

  // ---- 道具（关2 的南瓜） ----
  // 失败时**不销毁旧南瓜**（D26）：它留在停下的地方，只在原位再长一颗新的。
  // 理由：重生是这个游戏里唯一会拿走玩家东西的操作，能少拿一次就少拿一次。
  function createProp(def, isRespawn) {
    // 鱼（关5 动态 prop，南瓜同族先例，非机关）：水平巡游 + 顶回小人，不固定/不破坏任何物体
    if (def.kind === 'fish') {
      const mat = MATERIALS.fish;
      const body = MATTER_RT.Bodies.rectangle(def.x, def.y, def.w, def.h, {
        label: 'prop', friction: mat.friction, frictionStatic: mat.frictionStatic,
        restitution: mat.restitution, frictionAir: mat.frictionAir,
      });
      MATTER_RT.Body.setDensity(body, DENSITY_FISH);   // 红线 L6：密度只在 materials.js 里写
      body.plugin = {
        kind: 'fish', home: { x: def.x, y: def.y }, homeY: def.y,
        vx0: Number.isFinite(def.vx0) ? def.vx0 : 0,
        xMin: Number.isFinite(def.xMin) ? def.xMin : def.x - 40,
        xMax: Number.isFinite(def.xMax) ? def.xMax : def.x + 40,
        stallMs: 0, settleMs: 0, isRespawn: !!isRespawn,
      };
      if (Number.isFinite(def.vx0)) MATTER_RT.Body.setVelocity(body, { x: def.vx0, y: 0 });
      world.addBody(body);
      state.props.push(body);
      return body;
    }
    // 南瓜（关2，D26 不变）
    const mat = MATERIALS.pumpkin;
    const body = MATTER_RT.Bodies.rectangle(def.x, def.y, def.w, def.h, {
      label: 'prop', friction: mat.friction, frictionStatic: mat.frictionStatic,
      restitution: mat.restitution, frictionAir: mat.frictionAir == null ? 0.01 : mat.frictionAir,
    });
    MATTER_RT.Body.setDensity(body, DENSITY_PUMPKIN);   // 红线 L6：密度只在 materials.js 里写
    body.plugin = {
      kind: def.kind, home: { x: def.x, y: def.y }, graceMs: def.graceMs || 0,
      vx0: Number.isFinite(def.vx0) ? def.vx0 : null, stallMs: 0, settleMs: 0,
      releaseOnSpawn: def.releaseOnSpawn === true,
      isRespawn: !!isRespawn,
    };
    if (body.plugin.graceMs > 0) MATTER_RT.Body.setStatic(body, true);
    world.addBody(body);
    state.props.push(body);
    return body;
  }
  for (const p of level.props || []) createProp(p, false);
  state.activeProp = 0;

  // ---- 怕痒 onContact 钩子分发（D15：碰撞 → 给接触方施加 Δv=TICKLE_K 恒定冲量）----
  // 由 compose 收集到的 hooks.onContact 在碰撞时被注入 { Matter, matterBody, otherBody, normal, nowMs }。
  // 怕痒体用「运行时维护的 id 集合」标记（不在 matter body.plugin 上挂 tickle 布尔）。
  //
  // ⚠️ 施加时机（实测决定，关键）：冲量必须在**求解器执行之前**施加（见 step 里的 beforeStep 调度），
  // 复用 stepWalker 改速度的同一安全路径。实测若放在物理步「之后」读 collisionActive 再施加，
  // 小人/造物处在「深接触」态（如板被压进地面约 10px 的准稳态）时，下一物理步求解器会把
  // 这份被回写的速度与已有的穿透修正叠加，解出无穷大分离速度 → 全场 NaN（f117 复现）。
  // 放在求解器之前，冲量作为本步求解的正常输入，与 stepWalker 的 setVelocity 等价安全。
  const tickleCooldown = new Map();   // 同对刚体 200ms 冷却，防一次接触跨多子步连发
  const tickleBodyIds = new Set();    // 当前场上带怕痒的造物刚体 id
  function markTickle(c, on) {
    if (!(c.composed && c.composed.flags && c.composed.flags.tickle)) return;
    for (const b of c.bodies) { if (on) tickleBodyIds.add(b.id); else tickleBodyIds.delete(b.id); }
  }
  function applyTickle(tickleBody, other, pair) {
    if (!other || other.isStatic) return;                  // 不弹静态体
    if (other.plugin && other.plugin.creature) return;     // 不弹自己阵营的造物
    const c = tickleBody.plugin && tickleBody.plugin.creature;
    if (!c || !c.composed || !c.composed.hooks) return;
    const hooks = c.composed.hooks.filter((h) => h.event === 'onContact');
    if (!hooks.length) return;
    const nowMs = state.elapsedMs;
    const key = Math.min(tickleBody.id, other.id) + '+' + Math.max(tickleBody.id, other.id);
    const last = tickleCooldown.get(key);
    if (last != null && nowMs - last < TICKLE_COOLDOWN_MS) return;
    tickleCooldown.set(key, nowMs);
    const n = pair.collision && pair.collision.normal
      ? { x: pair.collision.normal.x, y: pair.collision.normal.y }
      : { x: 0, y: -1 };
    for (const h of hooks) {
      if (typeof console !== 'undefined' && console.__tickleApply) {
        const a = tickleBody.position, b = other.position;
        const dx = b.x - a.x, dy = b.y - a.y;
        console.error('[apply] mb=', a, 'ob=', b, 'obv=', other.velocity, 'dx,dy=', dx.toFixed(2), dy.toFixed(2));
      }
      h.fn({ Matter: MATTER_RT, matterBody: tickleBody, otherBody: other, normal: n, nowMs });
    }
    emit('creature:tickle', { creatureId: c.id, actor: !!(other.plugin && other.plugin.actor) });
  }
  /** 物理步结束后调用：扫描当前活跃碰撞对，对已识别的怕痒接触施加冲量（求解器外，安全） */
  function flushTickles() {
    if (!tickleBodyIds.size) return;
    const pairs = (world.engine.pairs && world.engine.pairs.collisionActive) || [];
    for (const pair of pairs) {
      if (!pair.isActive) continue;
      const a = pair.bodyA, b = pair.bodyB;
      const ta = tickleBodyIds.has(a.id);
      const tb = tickleBodyIds.has(b.id);
      if (ta && !tb) applyTickle(a, b, pair);
      else if (tb && !ta) applyTickle(b, a, pair);
    }
  }

  // ---- 压板 ----
  for (const pl of level.plates || []) {
    state.plates.push({
      def: pl, load: 0, holdMs: 0, releaseMs: 0, on: false, everOn: false,
    });
  }

  function emit(ev, payload) { bus.emit(ev, payload); }

  function addCreatureBodies(c) {
    for (const b of c.bodies) world.addBody(b);
    for (const con of c.constraints) world.addConstraint(con);
  }
  function removeCreatureBodies(c) {
    for (const con of c.constraints) world.removeConstraint(con);
    for (const b of c.bodies) world.removeBody(b);
    c.bodies = [];
    c.constraints = [];
  }

  function despawnCreature(c) {
    markTickle(c, false);
    removeCreatureBodies(c);
    BodyBudget.release();
    const i = state.creatures.indexOf(c);
    if (i >= 0) state.creatures.splice(i, 1);
    if (state.activeCreature === c) state.activeCreature = null;
    emit('creature:despawn', { id: c.id });
  }

  /** 生成造物：落点 x = 笔画质心 x（造物簿与世界共用同一 x 轴），从天下掉下来 */
  function spawnCreature(spec) {
    if (state.status !== 'playing') return null;
    // N1：不清空旧造物，只在超过上限时让**最旧**的那个淡出
    const live = state.creatures.filter((c) => !(c.fadeMs > 0));
    while (live.length >= MAX_LIVE_CREATURES) {
      const oldest = live.shift();
      if (!oldest) break;
      oldest.fadeMs = CREATURE_FADE_MS;
      for (const b of oldest.bodies) { b.render = b.render || {}; b.render.opacity = 1; }
    }
    if (!BodyBudget.trySpawn()) {
      emit('creature:rejected', { reason: 'budget' });
      return null;
    }
    const spawn = {
      x: clampNum(spec.geo.centroid.x, 18, DESIGN_W - 18),
      y: level.spawnY == null ? 84 : level.spawnY,
    };
    const composed = composeAbilities(state.armedAbilities);
    const built = buildCreatureBody({
      form: spec.form, geo: spec.geo, thickness: spec.thickness, spawn,
      mods: composed.mods, flags: composed.flags,
    });
    const c = {
      id: ++state.creatureSeq,
      form: spec.form,
      geo: spec.geo,
      thickness: spec.thickness,
      bodies: built.bodies,
      constraints: built.constraints,
      degraded: built.degraded,
      abilities: state.armedAbilities.slice(),
      composed,
      spawn,
      bornAt: state.elapsedMs,
    };
    for (const b of c.bodies) {
      b.plugin = b.plugin || {};
      b.plugin.landingFrames = LANDING_FRAMES;
      b.plugin.creature = c;
    }
    markTickle(c, true);
    addCreatureBodies(c);
    state.creatures.push(c);
    state.activeCreature = c;
    if (state.actor && !state.actor.active && state.actorReadyAt < 0) state.actorReadyAt = state.elapsedMs + 600;
    // 关2：南瓜一开始被钉住，等玩家把接驳坡架好再放手（否则玩家还没反应过来它就滑进河里了）
    for (const p of state.props) {
      if (p.plugin && p.plugin.releaseOnSpawn && p.isStatic && p.plugin.graceMs > 3000) {
        p.plugin.graceMs = level.propReleaseDelayMs || 1500;
      }
    }
    if (built.degraded !== 'none') state.degradeLog.push({ id: c.id, degraded: built.degraded });
    const main = c.bodies.reduce((a, b) => (b.mass > a.mass ? b : a), c.bodies[0]);
    emit('creature:spawn', {
      id: c.id, form: c.form, spawn, degraded: built.degraded,
      mass: main ? main.mass : 0, parts: main ? main.parts.length - 1 : 0,
      abilities: c.abilities.slice(),
    });
    return c;
  }

  /** 质量加权重心（多刚体造物用它对齐位置，单刚体就是 position） */
  function massCenter(bodies) {
    let m = 0, x = 0, y = 0;
    for (const b of bodies) { m += b.mass; x += b.position.x * b.mass; y += b.position.y * b.mass; }
    return m > 0 ? { x: x / m, y: y / m } : { x: 0, y: 0 };
  }

  function rebuildCreature(c) {
    const primary = c.bodies.reduce((a, b) => (b.mass > a.mass ? b : a), c.bodies[0]);
    const anchor = massCenter(c.bodies);          // 重建前后的重心必须重合
    const vel = { x: primary.velocity.x, y: primary.velocity.y };
    const ang = primary.angle;
    const av = primary.angularVelocity;
    removeCreatureBodies(c);
    const composed = composeAbilities(c.abilities);
    // 先以原点为锚构建（buildCreatureBody 会把它按 geo 质心居中到 spawn），再整体平移到原重心。
    // 不能用“主刚体位置”当 spawn：软梁两个半段的中心不是整根梁的中心，会横移 len/4。
    const built = buildCreatureBody({
      form: c.form, geo: c.geo, thickness: c.thickness, spawn: { x: 0, y: 0 },
      mods: composed.mods, flags: composed.flags,
    });
    const after = massCenter(built.bodies);
    const dx = anchor.x - after.x;
    const dy = anchor.y - after.y;
    if (dx || dy) for (const b of built.bodies) MATTER_RT.Body.setPosition(b, { x: b.position.x + dx, y: b.position.y + dy });
    c.bodies = built.bodies;
    c.constraints = built.constraints;
    c.degraded = built.degraded;
    c.composed = composed;
    addCreatureBodies(c);
    markTickle(c, false);   // 清掉旧刚体 id（如从软梁重建成硬梁，刚体已换）
    for (const b of c.bodies) {
      b.plugin = b.plugin || {};
      b.plugin.creature = c;
      MATTER_RT.Body.setVelocity(b, vel);
      MATTER_RT.Body.setAngularVelocity(b, av);
      if (c.bodies.length === 1) MATTER_RT.Body.setAngle(b, ang);
    }
    markTickle(c, true);
  }

  /** 点芯片：有造物就重建它，没造物就预选给下一个 */
  function setAbility(id) {
    const c = state.activeCreature;
    if (!c) {
      const i = state.armedAbilities.indexOf(id);
      if (i >= 0) state.armedAbilities.splice(i, 1);
      else if (state.armedAbilities.length < MAX_ABILITIES_PER_CREATURE) state.armedAbilities.push(id);
      else { emit('ability:rejected', { id, reason: 'cap' }); return { rejected: true }; }
      emit('ability:attach', { id, on: state.armedAbilities.includes(id), armed: true });
      return { armed: true };
    }
    const has = c.abilities.indexOf(id) >= 0;
    if (!has && c.abilities.length >= MAX_ABILITIES_PER_CREATURE) {
      emit('ability:rejected', { id, reason: 'cap' });
      return { rejected: true };
    }
    if (has) c.abilities = c.abilities.filter((a) => a !== id);
    else c.abilities.push(id);
    state.armedAbilities = c.abilities.slice();
    rebuildCreature(c);
    emit('ability:attach', { id, on: !has, form: c.form });
    if (!has && c.composed.combos.length) emit('combo:trigger', { ids: c.abilities.slice(), combos: c.composed.combos });
    return { ok: true, abilities: c.abilities.slice() };
  }

  function fail(reason) {
    state.failStreak++;
    state.lastFailReason = reason;
    state.hintLevel = Math.min(3, state.failStreak);
    emit('level:fail', { reason, failStreak: state.failStreak, hintLevel: state.hintLevel, failSfx: level.failSfx || null });
  }

  /** 南瓜被判定为终态（碎 / 退回岸 / 站在造物上 / 卡沟壁）：报失败，并在原位再长一颗 */
  function failProp(p, reason) {
    if (p.plugin.verdict) return;
    p.plugin.verdict = reason;
    fail(reason);
    // D26：旧南瓜**不销毁**，留在停下的地方；新的一颗回台沿原位。
    const def = level.props[0];
    if (def) createProp(def, true);
    state.activeProp = state.props.length - 1;
  }

  /**
   * 南瓜底下第一块支撑是不是造物（梁顶 / 团块顶）。
   * 不能只做射线：射线只取"下方第一块"，会把**压在南瓜上**的造物也算进来（实测误判）。
   * 这里直接按几何判：造物顶面必须在南瓜底面下方 14px 内、且水平投影有重叠。
   */
  function supportIsCreature(p) {
    const bottom = p.bounds.max.y;
    for (const c of state.creatures) {
      for (const b of c.bodies) {
        if (b.isStatic) continue;
        const dy = b.bounds.min.y - bottom;
        if (dy < -2 || dy > 14) continue;
        const overlap = Math.min(b.bounds.max.x, p.bounds.max.x) - Math.max(b.bounds.min.x, p.bounds.min.x);
        if (overlap > 6) return true;
      }
    }
    return false;
  }

  function updateWalker(dtMs) {
    const a = state.actor;
    if (!a) return;
    const failY = level.resetActorIfBelowY == null ? 1e9 : level.resetActorIfBelowY;
    if (a.body.position.y > failY) {
      a.pitMs += dtMs;
      if (a.pitMs > ACTOR_PIT_FAIL_MS) {
        a.pitMs = 0;
        MATTER_RT.Body.setPosition(a.body, a.start);
        MATTER_RT.Body.setVelocity(a.body, { x: 0, y: 0 });
        MATTER_RT.Body.setAngularVelocity(a.body, 0);
        fail('actor-fell');
      }
    } else if (a.body.position.y < failY - 60) {
      // 只有真的回到地面才算“没掉下去”；小人跳跃会短暂高过 failY，不能用 failY 直接清零
      a.pitMs = 0;
    }
  }

  function updatePlates(dtMs) {
    for (const p of state.plates) {
      const d = p.def;
      const hits = world.bodiesInRect({ x: d.x, y: d.y, w: d.w, h: d.h });
      let load = 0;
      for (const b of hits) {
        if (b.isStatic) continue;
        if (b === (state.actor && state.actor.body)) { load += b.mass; continue; }
        const speed = Math.hypot(b.velocity.x, b.velocity.y);
        if (speed > PLATE.minBodySpeed) continue;
        load += b.mass;
      }
      p.load = load;
      const pressed = load >= d.threshold;
      if (pressed) { p.holdMs += dtMs; p.releaseMs = 0; } else {
        p.releaseMs += dtMs;
        if (p.releaseMs > PLATE.releaseMs) p.holdMs = 0;
      }
      const wasOn = p.on;
      p.on = p.holdMs >= PLATE.sustainMs;
      if (p.on && !wasOn && !p.everOn) { p.everOn = true; emit('plate:on', { id: d.id, load }); }
      if (!p.on && wasOn) emit('plate:off', { id: d.id, load });
    }
  }

  /** 关3 的“压不动”失败：有造物压上去但重量一直不够 */
  function updatePlateSoftFail(dtMs) {
    for (const p of state.plates) {
      for (const c of state.creatures) {
        if (state.plateFailMark.has(c.id)) continue;
        const held = c.bodies.some((b) => b.position.x > p.def.x - 10 && b.position.x < p.def.x + p.def.w + 10 &&
          b.position.y > p.def.y - 40 && b.position.y < p.def.y + p.def.h + 30);
        if (!held) continue;
        c.plateSettleMs = (c.plateSettleMs || 0) + dtMs;
        if (c.plateSettleMs > PLATE_LIGHT_FAIL_MS && p.load < p.def.threshold) {
          state.plateFailMark.add(c.id);
          fail('too-light');
        }
      }
    }
  }

  function checkGoal() {
    const g = level.goal;
    if (!g) return;   // 沙盒：goal=null → 永不 win / 永不 fail
    if (g.type === 'reachActor') {
      const a = state.actor;
      if (a && a.body.position.x >= g.x && a.body.position.y <= (g.maxY == null ? 400 : g.maxY)) win('actor-crossed');
    } else if (g.type === 'propReach') {
      const p = state.props[g.propIndex || 0];
      if (p && p.position.x >= g.x) win('prop-delivered');
    } else if (g.type === 'propInZone') {
      // ── 关2：**一条判定 + 四个终态**（D24/D25）──────────────────────────────
      // 判定只有一句：南瓜在**非收货口区域停止推进**并静止 → 失败。
      // 位置不参与"判不判"，只参与"说哪句"。
      //
      // **顺序是硬要求**：进收货口的南瓜同样是静止的，先判静止就会把 win 判成 fail。
      //   1 win  进收货口区域
      //   2 碎   到沟底但落在石头/棚布外沿（已有流程）
      //   3 fail-A 完全退回岸台面（右缘 ≤ 台沿）→ 不可推进
      //   4 fail-B 停在造物顶面（梁顶/团块顶）→ 不可推进
      //   5 fail-C 卡在沟壁（台面与沟底之间）→ 不可推进
      //   6 仍部分悬空 + 静止 → **不判任何终态**：这是正常初始态，也是可继续的状态
      //
      // "仍部分悬空"是位置事实而不是"动了多少"：造物垂直落下产生不了向右的水平推力，
      // 所以右缘一旦退回到台沿以内就再也推不回来了 = 不可推进。反之擦碰 100px 也不判失败。
      //
      // 注：本关南瓜初始就是悬空态（164..226），所以开局的静止永远不会落进 3–5 —— 这条
      // 依赖关卡几何。以后若有"南瓜初始就躺在岸上"的关，需要显式的 inPlay 标志。
      const p = state.props[state.activeProp];
      if (!p) return;
      const speed = Math.hypot(p.velocity.x, p.velocity.y);
      const spin = Math.abs(p.angularVelocity);
      const slow = speed < SETTLE_V && spin < SETTLE_W;
      p.plugin.settleMs = slow ? (p.plugin.settleMs || 0) + FIXED_STEP_MS : 0;
      const settled = p.plugin.settleMs >= SETTLE_MS;

      // 1 win
      if (p.position.y >= g.y && p.position.x >= g.x1 && p.position.x <= g.x2) { win('prop-caught'); return; }
      // 2 碎
      if (p.position.y >= g.y) {
        if (settled) failProp(p, 'prop-smashed');
        return;
      }
      if (!settled) return;
      // 3 fail-A 完全退回岸台面
      if (p.bounds.max.x <= CHASM_RIM_X + 1 && p.position.y < PROP_FLOOR_Y) { failProp(p, 'prop-back-on-bank'); return; }
      // 4 fail-B 停在造物顶面
      if (supportIsCreature(p)) { failProp(p, 'prop-on-creature'); return; }
      // 5 fail-C 卡在沟壁（台面与沟底之间）
      if (p.position.y > 320 && p.position.y < PROP_FLOOR_Y) { failProp(p, 'prop-wedged'); return; }
      // 6 仍悬空 / 仍在台面上但没退回去 → 不判，等玩家继续
    } else if (g.type === 'plateSustained') {
      const p = state.plates.find((x) => x.def.id === g.plateId) || state.plates[0];
      if (p && p.on) win('plate-sustained');
    }
  }

  function win(reason) {
    if (state.status === 'finished') return;
    state.status = 'finished';
    emit('level:win', { reason, elapsedMs: state.elapsedMs, failStreak: state.failStreak });
  }

  /** 南瓜的“预备—放行”：静止 graceMs 后转成动态（不用魔法，是关卡节奏） */
  /** 南瓜掉进河里之后：把农夫也送回起点，歇一会儿再来一次（否则他走到终点就再也不回来了 → 死路） */
  function resetActorForRetry() {
    const a = state.actor;
    if (!a) return;
    MATTER_RT.Body.setPosition(a.body, a.start);
    MATTER_RT.Body.setVelocity(a.body, { x: 0, y: 0 });
    MATTER_RT.Body.setAngularVelocity(a.body, 0);
    a.active = false;
    a.pitMs = 0;
    a.stuck = 0;
    a.jumpCd = 0;
    a.lastX = a.start.x;
    state.actorResumeAt = state.elapsedMs + (level.propRetryMs || 1200);
  }

  function updatePropGrace(dtMs) {
    for (const p of state.props) {
      if (!p.plugin || !(p.plugin.graceMs > 0)) continue;
      if (p.isStatic) {
        p.plugin.graceMs -= dtMs;
        if (p.plugin.graceMs <= 0) {
          MATTER_RT.Body.setStatic(p, false);
          if (Number.isFinite(p.plugin.vx0)) MATTER_RT.Body.setVelocity(p, { x: p.plugin.vx0, y: 0 });
          emit('prop:release', { kind: p.plugin.kind });
        }
      }
    }
  }

  function updatePropStall(dtMs) {
    // 老关2 用"南瓜卡住"当失败（那时解法是让它滑）；新关2 里**南瓜不动才是正常初始状态**，
    // 所以只在关卡显式声明 propStallFails=true 时才判（goal.type==='propInZone' 的关不判）。
    if (level.goal && level.goal.type === 'propInZone') return;
    for (const p of state.props) {
      if (!p.plugin || p.isStatic) continue;
      if (p.plugin.kind === 'fish') continue;   // 鱼不判停滞失败（非南瓜机制）
      const speed = Math.hypot(p.velocity.x, p.velocity.y);
      if (speed < 0.12) p.plugin.stallMs += dtMs; else p.plugin.stallMs = 0;
      if (p.plugin.stallMs > 3000) {
        p.plugin.stallMs = 0;
        fail('prop-stalled');
        MATTER_RT.Body.setPosition(p, p.plugin.home);
        MATTER_RT.Body.setVelocity(p, { x: 0, y: 0 });
        MATTER_RT.Body.setAngle(p, 0);
        MATTER_RT.Body.setAngularVelocity(p, 0);
        p.plugin.graceMs = 1200;
        MATTER_RT.Body.setStatic(p, true);
        resetActorForRetry();
      }
    }
  }

  function updatePropReset() {
    const limit = level.resetPropIfBelowY;
    if (limit == null) return;
    for (const p of state.props.slice()) {
      if (p.plugin.kind === 'fish') continue;   // 鱼锁定在 swim line，不参与掉出回收
      if (p.position.y <= limit || p.plugin.verdict) continue;
      // 掉出世界了：这一颗确实留不住（它不是"停在哪"，是没了），所以从世界里移走再补一颗。
      p.plugin.verdict = 'prop-lost';
      world.removeBody(p);
      const i = state.props.indexOf(p);
      if (i >= 0) state.props.splice(i, 1);
      state.activeProp = Math.max(0, state.activeProp - (i >= 0 && i < state.activeProp ? 1 : 0));
      fail('prop-lost');
      const def = level.props[0];
      if (def) createProp(def, true);
      state.activeProp = state.props.length - 1;
      resetActorForRetry();
    }
  }

  /** 关5 鱼：水平巡游（xMin/xMax 间按 vx0 往返、遇界反弹），锁定在 swim line（抵消无河床重力），
   *  撞到小人就把它顶回岸边（纯碰撞 + 重置，非机关、不伤害）。 */
  function updateFish(dtMs) {
    for (const p of state.props) {
      if (!p.plugin || p.plugin.kind !== 'fish') continue;
      const xMin = p.plugin.xMin, xMax = p.plugin.xMax, vx0 = p.plugin.vx0, homeY = p.plugin.homeY;
      let vx = p.velocity.x;
      if (vx === 0) vx = vx0;
      if (p.position.x <= xMin && vx < 0) vx = Math.abs(vx0);
      else if (p.position.x >= xMax && vx > 0) vx = -Math.abs(vx0);
      // 锁定 swim line：每帧手动抵消重力（河里无河床），鱼才不会掉进虚空
      if (Math.abs(p.position.y - homeY) > 1.5) MATTER_RT.Body.setPosition(p, { x: p.position.x, y: homeY });
      MATTER_RT.Body.setVelocity(p, { x: vx, y: 0 });
      // 顶回小人（不咬不伤：撞到就重置，失败可推进）
      if (state.actor) {
        const dx = p.position.x - state.actor.body.position.x;
        const dy = p.position.y - state.actor.body.position.y;
        if (Math.hypot(dx, dy) < ACTOR.radius + 22) {
          if ((state.actor.biteCd || 0) <= 0) {
            state.actor.biteCd = 700;
            resetActorForRetry();
            fail('actor-bitten');
            emit('actor:bitten', { by: 'fish' });
          }
        }
      }
    }
  }

  function step(frames) {
    const n = frames == null ? 1 : Math.max(1, frames | 0);
    const advanced = world.stepFrame(n, (subDt) => {
      // 怕痒冲量：在求解器「之前」施加（用上一物理步留下的活跃碰撞对），与 stepWalker 的
      // setVelocity 同一条安全路径。放在物理步「之后」改速度会让深接触态的小人/造物在下一步
      // 求解时爆 NaN（实测 f117 全场 NaN）。见上方 dispatcher 注释。
      flushTickles();
      if (state.actor && state.actor.active && state.status === 'playing') stepWalker(state.actor, world, subDt);
      // 造物落地缓冲：生成后 26 帧内限制下落速度，让“架在沟沿上”是可控而非撞运气
      for (const c of state.creatures) {
        for (const b of c.bodies) {
          if (b.plugin && b.plugin.landingFrames > 0) {
            b.plugin.landingFrames--;
            if (b.velocity.y > LANDING_MAX_FALL_SPEED) {
              MATTER_RT.Body.setVelocity(b, { x: b.velocity.x, y: LANDING_MAX_FALL_SPEED });
            }
          }
        }
      }
    });
    const dt = advanced * FIXED_STEP_MS;
    state.elapsedMs += dt;
    // 造物落地后 600ms，小人开始行动（先让它掉下来、站稳）
    if (state.actor && !state.actor.active && state.actorReadyAt >= 0 && state.elapsedMs >= state.actorReadyAt) {
      state.actor.active = true;
      emit('actor:go', { label: state.actor.label });
    }
    // 南瓜掉河后的重试：歇够了农夫自己再走一趟
    if (state.actor && !state.actor.active && state.actorResumeAt >= 0 && state.elapsedMs >= state.actorResumeAt) {
      state.actorResumeAt = -1;
      state.actor.active = true;
      emit('actor:go', { label: state.actor.label, retry: true });
    }
    if (state.actor && state.actor.biteCd > 0) state.actor.biteCd = Math.max(0, state.actor.biteCd - dt);
    updateWalker(dt);
    updatePropGrace(dt);
    updatePropStall(dt);
    updatePropReset();
    updateFish(dt);
    updatePlates(dt);
    updatePlateSoftFail(dt);
    // 淡出中的造物：透明度线性衰减，归零才真正移除
    for (const c of state.creatures.slice()) {
      if (!(c.fadeMs > 0)) continue;
      c.fadeMs -= dt;
      const a = Math.max(0, c.fadeMs / CREATURE_FADE_MS);
      for (const b of c.bodies) { b.render = b.render || {}; b.render.opacity = a; }
      if (c.fadeMs <= 0) despawnCreature(c);
    }
    // 掉出世界的造物回收，避免越积越多
    for (const c of state.creatures.slice()) {
      const lowest = Math.max(...c.bodies.map((b) => b.position.y));
      if (lowest > CREATURE_DESPAWN_Y) {
        const id = c.id;
        despawnCreature(c);
        emit('creature:lost', { id });
      }
    }
    if (state.status === 'playing') checkGoal();
    return dt;
  }

  function snapshot() {
    const c = state.activeCreature;
    const geo = c ? c.geo : null;
    const main = c ? c.bodies.reduce((a, b) => (b.mass > a.mass ? b : a), c.bodies[0]) : null;
    return {
      levelId: level.id,
      title: level.title,
      status: state.status,
      elapsedMs: state.elapsedMs,
      failStreak: state.failStreak,
      hintLevel: state.hintLevel,
      chips: level.chips,
      armedAbilities: state.armedAbilities.slice(),
      creature: c ? {
        id: c.id, form: c.form,
        label: { beam: '梁', wheel: '轮', blob: '团块', container: '容器', rope: '绳', pile: '松散堆', grain: '颗粒' }[c.form] || c.form,
        degraded: c.degraded,
        mass: main ? main.mass : 0,
        parts: main ? main.parts.length - 1 : 0,
        bodies: c.bodies.length,
        abilities: c.abilities.slice(),
        mods: c.composed.mods,
        combos: c.composed.combos.map((x) => x.name),
        geo: geo ? {
          w: geo.bbox.w, h: geo.bbox.h, aspect: geo.aspect, area: geo.area,
          perimeter: geo.perimeter, closed: geo.closed, selfIntersect: geo.selfIntersect,
          nodes: geo.nodes, centroid: geo.centroid,
        } : null,
      } : null,
      plate: state.plates.map((p) => ({
        id: p.def.id, load: p.load, threshold: p.def.threshold, holdMs: p.holdMs, on: p.on,
      })),
      actorPos: state.actor ? { x: state.actor.body.position.x, y: state.actor.body.position.y } : null,
      propPos: state.props[state.activeProp] ? { x: state.props[state.activeProp].position.x, y: state.props[state.activeProp].position.y } : null,
      hints: level.hints,
      guides: level.guides || [],
      degradeLog: state.degradeLog.slice(-5),
    };
  }

  function destroy() {
    for (const c of state.creatures.slice()) despawnCreature(c);
    world.clear();
  }

  return {
    state,
    level,
    spawnCreature,
    setAbility,
    step,
    snapshot,
    destroy,
    get status() { return state.status; },
    get creatures() { return state.creatures; },
  };
}

/**
 * src/audio/voice-scheduler.js —— 语音排队与配额（`audio-spec-v2` 附录 **C.1 / C.1b / C.2**）
 *
 * 这个文件是**纯逻辑**：不碰 `speechSynthesis`、不碰 `AudioContext`、不读时钟（时钟注入）。
 * 只有这样，C.1 那张"五步优先序"才能被单测逐条数出来——否则它只能靠读代码相信。
 *
 * ── C.1 五步（顺序写死，不许实现方自行调换）────────────────────────────────
 *   ① C5 说话人不在画面内 → **挂起**（不扣、不丢），等 `onScreen` 变 true
 *   ② 配额预检（**只读**）→ 不够就**不出队**，连 C4 的延后都别做
 *   ③ C4 同音色 45s 间隔 → 未到就延后（不扣）
 *   ④ 超时整句丢弃 → 丢弃（不扣）
 *   ⑤ `utterance.onstart` → **扣 1 次；这是全程唯一允许扣费的地方**
 *
 * 为什么不能只在 ⑤ 检查额度：会出现"C4 已延后 30 秒 → 到点发现额度没了 → 丢弃"，
 * 玩家白等 30 秒，这次延后完全是白做的。所以 ② 只读预检必须在入队前。
 *
 * ── C.1b 「抢占」与「终止」是两个动作 ─────────────────────────────────────
 *   · `dropPending()`   只从**队列**里摘掉：**不扣费**，是优先手段；
 *   · `abortSpeaking()` 对**已起播**的句子 cancel：**已扣不退**，只在语义过期时用。
 *   合成一个 `cancel()` 会撞上场景边界（切关时上一关还在念 = 音画脱钩，会被当 bug 报）。
 *
 * ── C.2 两套额度不要混 ──────────────────────────────────────────────────────
 *   本文件的 `budget` 是**语音额度**（整局 ≤30 条 / ≤75 s）；
 *   主程序的 `sayCapped` 是**文字出现次数**。
 *   两者共用 → 文字把语音额度吃光 → 症状是"字幕全出来了，却一句都没念"，
 *   而排查看起来像语音坏了（会先去查 getVoices），方向全错。
 */

const VOICE_SPEAKER_INTERVAL_MS = 45000;   // C4 同音色强制间隔 [待实机标定]
const VOICE_PENDING_TTL_MS = 45000;         // 挂起/延后的兜底上限（过窗判据优先用事件）[待实机标定]
const VOICE_BUDGET_LINES = 30;              // 整局语音条数上限 [待实机标定]
const VOICE_BUDGET_MS = 75000;              // 整局语音时长上限 [待实机标定]

/**
 * C.1b 级别：由**时机**决定，不由文案内容决定（否则会冒出"这句写得重要所以不给抢"）
 * 数字越小优先级越高；≥INTRO 的可被抢占，SUCCESS/SCOPED 不可抢占。
 */
const LINE_LEVEL = {
  SUCCESS: 1,        // 首次成功 / 章节盖章 / 终局
  SCOPED: 2,         // 受逐句稀缺额度约束的句子（common_fail2、各关失败暗示）
  INTRO: 3,          // 关卡开场
  AMBIENT: 4,        // 隐藏解法 / 环境吐槽
};
const canPreempt = (lv) => lv >= LINE_LEVEL.INTRO;

/**
 * @param {object} o
 * @param {{speak:(u:object)=>void, cancel:()=>void}} o.backend  语音后端（audio-bus 注入）
 * @param {()=>number} o.now                                    时钟（ms）
 * @param {(speaker:string)=>boolean} [o.isOnScreen]             C5 前置条件，由主程序提供
 * @param {(lineId:string)=>boolean} [o.precheckQuota]           **只读**文字额度预检（C.1 第 2 步）
 * @param {(lineId:string)=>void} [o.onSpoken]                   真正起播后的回调（诊断/打点）
 * @param {(lineId:string, reason:string)=>void} [o.onAbort]      终止回调（诊断/打点）
 */
function createVoiceScheduler(o) {
  const backend = o.backend;
  const now = o.now || (() => Date.now());
  const isOnScreen = o.isOnScreen || (() => true);
  const precheckQuota = o.precheckQuota || (() => true);

  let playing = null;              // { lineId, speaker, level, startedAt }
  let pending = null;              // { lineId, speaker, level, textMs, enqueuedAt, notBefore, suspended }
  const lastStartAt = new Map();   // speaker → 上次真正起播的时间（C4 用）
  const budget = { lines: 0, ms: 0 };

  function start(entry) {
    playing = { lineId: entry.lineId, speaker: entry.speaker, level: entry.level, startedAt: now() };
    const mine = playing;
    backend.speak({
      lineId: entry.lineId,
      text: entry.text,
      speaker: entry.speaker,
      // ⑤ 全程唯一允许扣费的地方
      onStart: () => {
        budget.lines += 1;
        budget.ms += Math.max(0, entry.textMs || 0);
        lastStartAt.set(entry.speaker, now());
        if (o.onSpoken) o.onSpoken(entry.lineId);
      },
      onEnd: () => { if (playing === mine) playing = null; },
      onError: () => { if (playing === mine) playing = null; },
    });
  }

  /**
   * 推进一步：① C5 → ② 只读预检 → ③ C4 → ④ 超时 → ⑤ 起播
   * 返回六态口径的结果（见文件头的 C.1c）：'started' | 'queued' | 'deferred' | 'blocked' | 'dropped'。
   * **永远不会返回 'played'**：onstart 是异步的，同步说"已播"是假信息。
   */
  function pump() {
    if (playing || !pending) return 'queued';       // 有句在播 → 排队等着
    const t = now();
    // ① C5：不在画面内 → 挂起（不扣、不丢）；过窗才作废，作废也不扣
    if (!isOnScreen(pending.speaker)) {
      pending.suspended = true;
      if (t - pending.enqueuedAt > VOICE_PENDING_TTL_MS) { pending = null; return 'dropped'; }
      return 'blocked';
    }
    pending.suspended = false;
    // ② 配额只读预检：不够就直接不出队（连 C4 的延后都别做）
    if (!precheckQuota(pending.lineId)) { pending = null; return 'dropped'; }
    // ③ C4 同音色间隔：延后，不扣
    const last = lastStartAt.get(pending.speaker);
    const notBefore = Math.max(pending.notBefore || 0,
      last == null ? 0 : last + VOICE_SPEAKER_INTERVAL_MS);
    if (t < notBefore) { pending.notBefore = notBefore; return 'deferred'; }
    // ④ 超时整句丢弃：不扣。
    // 计时从"**它本来可以起播**"那一刻算起，不是从入队算起 —— 否则 TTL 与 C4 同为 45s 时，

    const eligibleAt = Math.max(pending.enqueuedAt, pending.notBefore || 0);

/**
 * 同一句台词的**配额**（附录 A：同句最多 2 次，超额静默）。
 * 静默不致命——视觉提示会接手；**绝不许用同义句填空**（换句会被读成"判定变了"）。
 *
 * 粒度有两个档（附录 A 的例外条款）：
 *   · **整局（per-run）**：落地形态台词、各关专属失败暗示 —— 重置点在开局/不可重置；
 *   · **每关（per-level）**：跨关通用兜底句（见 PER_LEVEL_LINE_IDS）—— 进关时 `reset()`。
 * 兜底句必须按每关计：它是"任何没预料到的终态都还有一句话"的安全网，
 * 整局额度被前一关吃光，关3..关9 就没有兜底了，只剩余光和静默。
 *
 * 抽成纯函数是为了能被单测直接数到：连接成功 ≠ 会被执行，配额也一样，必须能断言。
 */
function createLineQuota(max = 2) {
  let said = new Map();
  /** 额度查得到底了没有（**只查不扣**）——用来把"扣"推迟到真正交付那一刻 */
  const exhausted = (id) => (said.get(id) || 0) >= max;
  /** 真正交付了才扣（被拦下的一次都不许扣） */
  const take = (id) => { said.set(id, (said.get(id) || 0) + 1); };
  /** 便捷组合：查+扣在同一刻（只适合"请求即交付"的场景，例如纯文字） */
  const allow = (id) => {
    if (exhausted(id)) return false;
    take(id);
    return true;
  };
  allow.exhausted = exhausted;
  allow.take = take;
  /** 进关时调用：只给"每关"那一档用，整局档永远不 reset */
  allow.reset = () => { said = new Map(); };
  return allow;
}

/** 跨关通用兜底句：配额按「每关」计，不是整局 */
const PER_LEVEL_LINE_IDS = ['common_fail2'];
function isPerLevelLine(id) {
  return PER_LEVEL_LINE_IDS.indexOf(id) >= 0;
}

/**
 * 台词的 **C.1b 级别**：由**时机**决定，不由文案内容决定。
 * 1 首次成功 / 章节盖章 / 终局　2 受逐句稀缺额度约束（兜底句、各关失败暗示）
 * 3 关卡开场　4 隐藏解法 / 环境吐槽
 * 为什么按 id 前缀推而不是逐句手标：同一时机下不同措辞硬软不同，
 * 逐句标会冒出"这句写得比较重要所以不给抢"这种无法执行的主观判断，且两份文档会各自漂移。
 */
function lineVoiceLevel(id) {
  if (id == null) return 4;
  if (/^(form_|common_fail|l\d_fail)/.test(id)) return 2;
  if (/_win$/.test(id) || /^stamp/.test(id)) return 1;
  if (/_intro$/.test(id)) return 3;
  return 4;
}

/** 台词文本；未知 id 返回 null（调用方决定不显示） */
function lineText(id) {
  const l = LINES[id];
  return l ? l.text : null;
}

function lineWho(id) {
  const l = LINES[id];
  return l ? l.who : '';
}

/** 粗估语音时长（ms）。中文约 5.5 字/秒 → 每字 180ms + 起播 250ms */
function estimateSpeechMs(text) {
  if (!text) return 0;
  return 250 + text.length * 180;
}

/**
 * 关1 的硬约束判据：这句台词能不能在盖章之前完整念完。
 * levels.md §338：剩余时长 < 朗读时长 + 0.3s → 整句丢弃，只留盖章；
 * 不允许把第 2 句挪到盖章之后。
 */
function canFitBeforeStamp(text, remainingMs) {
  return estimateSpeechMs(text) + 300 <= Math.max(0, remainingMs);
}

/**

 * @param {{read:(k:string)=>any, write:(k:string,v:any)=>void}} store SaveStore 抽象
 */
function loadSandbox(store) {
  const v = store && store.read ? store.read(SANDBOX_KEY) : null;
  if (!v || typeof v !== 'object') return { unlocked: false, creatures: [] };
  return {
    unlocked: !!v.unlocked,
    creatures: Array.isArray(v.creatures) ? v.creatures : [],
  };
}

/**
 * 存一个造物。返回 `{ ok, reason }`：
 *  - `ok:false, reason:'full'` 表示已达上限（调用方应提示「先删掉旧的」，**不静默丢**）。
 * @returns {{ok:boolean, reason?:string, count:number}}
 */
function saveCreature(store, creature) {
  const cur = loadSandbox(store);
  if (cur.creatures.length >= SANDBOX_MAX_CREATURES) {
    return { ok: false, reason: 'full', count: cur.creatures.length };
  }
  const rec = {
    id: creature.id || `c${Date.now()}`,
    form: creature.form || null,
    thickness: creature.thickness == null ? null : creature.thickness,
    abilities: Array.isArray(creature.abilities) ? creature.abilities.slice(0, 2) : [],
    name: creature.name || '',
    x: creature.x, y: creature.y,
    createdAt: Date.now(),
    // ★ 存原始笔画，不只存 form：只存 form 是**复原不出形状**的（同一个 beam
    //   可以是长是短是弯的）。规格 3.3「退场不丢」要的是"回来时东西还在原样"，
    //   所以必须存笔画，进场时用 analyzeStrokeGroup 重跑一遍几何。
    strokes: Array.isArray(creature.strokes) ? creature.strokes : [],
  };
  const next = { unlocked: true, creatures: cur.creatures.concat([rec]) };
  if (store && store.write) store.write(SANDBOX_KEY, next);
  return { ok: true, count: next.creatures.length };
}

/**
 * 按 id 删一个造物。返回 `{ ok, reason }`。
 * 为什么需要它：上限 30 满了以后，玩家只能"先删掉旧的"——不给他删的口子，
 * 那条"不静默丢"的提示就是死路一条（告诉他有问题却不给办法）。
 */
function removeCreature(store, id) {
  const cur = loadSandbox(store);
  const next = cur.creatures.filter((c) => c.id !== id);
  if (next.length === cur.creatures.length) return { ok: false, reason: 'notfound', count: next.length };
  if (store && store.write) store.write(SANDBOX_KEY, { unlocked: cur.unlocked, creatures: next });
  return { ok: true, count: next.length };
}

/** 标记沙盒已解锁（通关第 5 关那一刻调用） */
function unlockSandbox(store) {
  const cur = loadSandbox(store);
  if (cur.unlocked) return cur;
  const next = { unlocked: true, creatures: cur.creatures };
  if (store && store.write) store.write(SANDBOX_KEY, next);
  return next;
}
